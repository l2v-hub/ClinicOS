name: Codex issue review communication

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Codex bug pipeline']
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: clinicos-issue-review-communication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'l2v-hub/ClinicOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Execute only the trusted default branch, never workflow_run's PR/head SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Synchronize source-issue review communication
        env:
          # A PAT is deliberate: github.token comments do not wake other workflows.
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: node agent-team/src/bug-pipeline/issue-review-sync.mjs
