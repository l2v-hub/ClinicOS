name: Protect demo secret scope
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed current main commit SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: protect-demo-secret-scope
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'l2v-hub/ClinicOS' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'l2v-hub/ClinicOS/.github/workflows/protect-demo-secret.yml@refs/heads/main' &&
      github.actor == 'l2v-hub' &&
      github.sha == github.workflow_sha &&
      inputs.reviewed_sha == github.sha &&
      github.actor == github.triggering_actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check fixed workflow context and run credential-free tests
        env:
          PROTECT_DEMO_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          node --input-type=module -e "import { validateTrustedContext } from './scripts/automation/protect-demo-secret.mjs'; validateTrustedContext({eventName:process.env.GITHUB_EVENT_NAME,repository:process.env.GITHUB_REPOSITORY,ref:process.env.GITHUB_REF,workflowRef:process.env.GITHUB_WORKFLOW_REF,sha:process.env.GITHUB_SHA,workflowSha:process.env.GITHUB_WORKFLOW_SHA,actor:process.env.GITHUB_ACTOR,triggeringActor:process.env.GITHUB_TRIGGERING_ACTOR,reviewedSha:process.env.PROTECT_DEMO_REVIEWED_SHA})"
          node --test scripts/automation/protect-demo-secret.test.mjs
  ensure_environment_copy:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'l2v-hub/ClinicOS' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'l2v-hub/ClinicOS/.github/workflows/protect-demo-secret.yml@refs/heads/main' &&
      github.actor == 'l2v-hub' &&
      github.sha == github.workflow_sha &&
      inputs.reviewed_sha == github.sha &&
      github.actor == github.triggering_actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: 'glistening-friendship / demo'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Ensure the protected environment copy exists
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
          RAILWAY_DEMO_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
          PROTECT_DEMO_OPERATION: ensure-environment
          PROTECT_DEMO_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node scripts/automation/protect-demo-secret.mjs
  remove_repository_copy:
    needs: ensure_environment_copy
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'l2v-hub/ClinicOS' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'l2v-hub/ClinicOS/.github/workflows/protect-demo-secret.yml@refs/heads/main' &&
      github.actor == 'l2v-hub' &&
      github.sha == github.workflow_sha &&
      inputs.reviewed_sha == github.sha &&
      github.actor == github.triggering_actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: 'glistening-friendship / demo'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Remove only the repository-level copy after fresh environment verification
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
          RAILWAY_DEMO_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
          PROTECT_DEMO_OPERATION: remove-repository
          PROTECT_DEMO_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node scripts/automation/protect-demo-secret.mjs
