            if(m.verification!==null){assert(Array.isArray(m.verification)&&m.verification.length<=12);for(const v of m.verification){keys(v,['index','command','argsSha256','exitCode','ok','stdoutSanitizedCapturedBytes','stderrSanitizedCapturedBytes','stdoutSanitizedSha256','stderrSanitizedSha256']);assert(Number.isSafeInteger(v.index)&&v.index>=0&&v.index<12);assert(['npm','node'].includes(v.command));assert(typeof v.ok==='boolean');assert(v.exitCode===null||(Number.isSafeInteger(v.exitCode)&&v.exitCode>=0&&v.exitCode<=255));for(const k of['argsSha256','stdoutSanitizedSha256','stderrSanitizedSha256'])assert.match(v[k],/^[a-f0-9]{64}$/);for(const k of['stdoutSanitizedCapturedBytes','stderrSanitizedCapturedBytes'])assert(Number.isSafeInteger(v[k])&&v[k]>=0&&v[k]<=2*1024*1024);}}
