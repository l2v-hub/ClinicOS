          const MAX_FILE=256*1024,MAX_ROUND=2*1024*1024,MAX_SOURCE=8*1024*1024,MAX_PAYLOAD=16*1024*1024;
          const knownCredentialKey = `["']?(?:OPENAI_API_KEY|ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN|CODEX_ACCESS_TOKEN|DATABASE_URL|GITHUB_TOKEN|GH_TOKEN)["']?`;
          const secretPattern = new RegExp(`-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|(?:${knownCredentialKey}\\s*(?::\\s*[^=;\\n]+)?=\\s*(?:['"][^'"\\r\\n]+['"]|[^\\s;]+)|${knownCredentialKey}\\s*:\\s*['"][^'"\\r\\n]+['"])|(?:password|secret|api[_-]?key|access[_-]?token)\\s*[:=]\\s*['"][A-Za-z0-9_+./=-]{12,}['"]|(?:postgres(?:ql)?|https?):\\/\\/[^\\s/@]+:[^\\s/@]+@`, 'i');
          
          function text(bytes,max=MAX_FILE){assert(bytes.length<=max);const content=new TextDecoder('utf-8',{fatal:true}).decode(bytes);assert(!/[\x00-\x08\x0b\x0c\x0e-\x1f]/.test(content));const whitespaceOnly=content.replace(/[ \t]+(\r?\n)/g,'$1').replace(/[ \t]+$/,'');assert.equal(sanitizeText(content),whitespaceOnly);assert(!secretPattern.test(content));return content;}
          function relative(file){assert(typeof file==='string'&&file.length>0&&file.length<500&&!file.startsWith('/')&&!file.includes('\\'));assert(file.split('/').every(p=>p&&p!=='.'&&p!=='..'));return file;}
          function sourceName(file){relative(file);assert(!/(?:^|\/)(?:home|\.git|\.env[^/]*|credentials?|secrets?|tokens?)(?:\/|\.|$)/i.test(file));assert(/\.(?:[cm]?[jt]sx?|py|css|scss|html|sql|prisma)$/.test(file));return file;}
          async function inventory(root){assert.equal(await realpath(root),path.resolve(root));assert(!(await lstat(root)).isSymbolicLink());const files=[],dirs=[];let total=0;async function walk(rel=''){for(const name of await readdir(path.join(root,rel))){const f=relative(rel?rel+'/'+name:name),p=path.join(root,f),s=await lstat(p);assert(!s.isSymbolicLink());assert.equal((await realpath(p)).startsWith(path.resolve(root)+path.sep),true);if(s.isDirectory()){dirs.push(f);await walk(f);}else{assert(s.isFile()&&s.size<=3*1024*1024);files.push(f);total+=s.size;assert(files.length<=160&&total<=24*1024*1024);}}}await walk();return{files,dirs};}
          async function regular(root,file,max){relative(file);const p=path.join(root,file),s=await lstat(p);assert(s.isFile()&&!s.isSymbolicLink()&&s.size<=max);assert((await realpath(p)).startsWith(path.resolve(root)+path.sep));return readFile(p);}
