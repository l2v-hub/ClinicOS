          export async function collect(root){
           assert.equal(await realpath(root),path.resolve(root));let entries=0;const manifests=[],verificationCandidates=[];
           async function walk(dir){for(const name of await readdir(dir)){assert(++entries<=256);assert(name!=='.'&&name!=='..'&&!name.includes('\\'));const f=path.join(dir,name),s=await lstat(f);assert(!s.isSymbolicLink(),'Artifact symlink refused');if(s.isDirectory())await walk(f);else{assert(s.isFile()&&s.size<=4*1024*1024);if(name==='manifest.json')manifests.push(f);if(path.basename(path.dirname(f))==='verification'&&/^[a-f0-9-]{36}\.json$/.test(name))verificationCandidates.push(f);}}}await walk(root);assert.equal(manifests.length,1);const manifestPath=manifests[0],base=path.dirname(manifestPath);assert.equal(path.basename(base),'round-9-verify-before-'+CP);assert.equal(path.basename(path.dirname(base)),'bug-batch-506');const raw=await readFile(manifestPath);assert(raw.length<=64*1024);const m=JSON.parse(raw);assert.equal(m.schemaVersion,1);assert.equal(m.kind,'partial-failed-code-retention');assert.equal(m.completeness,'allowed-source-and-sanitized-failure-evidence-only');assert.equal(m.batchId,'bug-batch-506');assert.equal(m.round,9);assert.equal(m.failedStep,'verify-before');assert.equal(m.failureCode,'workspace-verification-failed');assert.equal(m.sourceSha,SHA);assert.equal(m.checkpointSha256,CP);assert(Array.isArray(m.files)&&m.files.length===12);const files=[],seen=new Set();let total=raw.length;
           async function add(relative,expected,scope=base,exported=relative){assert(typeof relative==='string'&&!relative.includes('\\')&&!relative.startsWith('/'));assert(relative.split('/').every(s=>s&&s!=='.'&&s!=='..'));assert(!seen.has(exported));seen.add(exported);let f=scope;for(const part of relative.split('/')){f=path.join(f,part);assert(!(await lstat(f)).isSymbolicLink());}const s=await lstat(f);assert(s.isFile()&&s.size<=2*1024*1024);assert((await realpath(f)).startsWith(scope+path.sep));const b=await readFile(f);assert.equal(b.length,s.size);total+=b.length;assert(total<=4*1024*1024);if(expected){assert.equal(hash(b),expected.sha256);assert.equal(b.length,expected.bytes);}files.push({file:exported,bytes:b.length,sha256:hash(b),base64:b.toString('base64')});return b;}
           for(const f of m.files){assert(typeof f.file==='string'&&/^(frontend\/|e2e\/|artifacts\/task-validation\/bug-batch-506\/)/.test(f.file));assert(!/(^|\/)\.git(\/|$)|(^|\/)\.env(?:\.|$)|(^|\/)node_modules\//.test(f.file));assert.match(f.sha256,/^[a-f0-9]{64}$/);assert(Number.isSafeInteger(f.bytes)&&f.bytes>=0&&f.bytes<=256*1024);await add('files/'+f.file,f);}
           await add('source.patch');assert.equal(m.modelReport,null);assert.deepEqual(m.verification,EXPECTED);
           assert.equal(verificationCandidates.length,1);const vf=verificationCandidates[0],rel=path.relative(root,vf);const vb=await add(rel,null,root,'verification/retained-verification.json');assert(vb.length<=128*1024);const vr=JSON.parse(vb);assert.equal(vr.schemaVersion,1);assert.equal(vr.kind,'bounded-sanitized-verification-failure');assert(Array.isArray(vr.entries)&&vr.entries.length===3);for(let i=0;i<vr.entries.length;i++){const e=vr.entries[i];assert.equal(e.batchId,'bug-batch-506');assert.equal(e.noTestsSignal,false);assert.equal(e.runnerError,null);for(const [k,value]of Object.entries(EXPECTED[i]))assert.deepEqual(e[k],value);for(const k of ['stdoutSanitizedExcerpt','stderrSanitizedExcerpt'])assert(typeof e[k]==='string'&&Buffer.byteLength(e[k])<=8192);}files.push({file:'manifest.json',bytes:raw.length,sha256:hash(raw),base64:raw.toString('base64')});const payload=Buffer.from(JSON.stringify({type:'fixed506-terminal-payload-v1',runId:40512823458,artifactId:12739301229,sourceSha:SHA,checkpointSha256:CP,files}));assert(payload.length<=6*1024*1024);return payload;
          }
          export function stream(raw){const zip=gzipSync(raw,{mtime:0});assert(zip.length<=6*1024*1024);const chunks=[];for(let i=0;i<zip.length;i+=6144)chunks.push(zip.subarray(i,i+6144).toString('base64'));return[JSON.stringify({type:'fixed506-terminal-stream-v1',payloadBytes:raw.length,payloadSha256:hash(raw),gzipBytes:zip.length,gzipSha256:hash(zip),chunkCount:chunks.length}),...chunks.map((data,index)=>JSON.stringify({type:'fixed506-terminal-chunk-v1',index,data}))].join('\n')+'\n';}
          if(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){try{assert.equal(process.env.GITHUB_REPOSITORY,'l2v-hub/ClinicOS');assert.equal(process.env.GITHUB_REF,'refs/heads/codex/506-terminal-reader-20261027');assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');process.stdout.write(stream(await collect(process.argv[2])));}catch{console.error('fixed506-terminal-reader-guard-refused');process.exitCode=1;}}
          FIXED_READER
          node "$reader" "$RUNNER_TEMP/fixed506-terminal-input"
