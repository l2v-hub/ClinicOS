name: Authorized production maintenance verification

# Restricted maintenance branch. The authorized cleanup is complete; verify only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'codex/production-inventory-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.66.0
      - name: Independently verify patient data is empty
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          node scripts/maintenance/railway-private-inventory-runner.mjs --verify-clean
      - name: Clear transient caches and retain private recovery backup
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: node scripts/maintenance/production-online-finalize.mjs
