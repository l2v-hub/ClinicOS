name: Deploy Backend to Railway

# Deploys the backend to Railway on every push to main (and on demand).
# GitHub-hosted runners can reach Railway's API, so this is more reliable than
# Railway's GitHub auto-deploy (which on this project kept serving an old commit).
#
# Required GitHub secret:
#   RAILWAY_TOKEN  -> a Railway *project* token scoped to the backend's project+environment
#                     (Railway dashboard -> project -> Settings -> Tokens -> Create,
#                      pick the Production environment).
# Optional GitHub variable (Settings -> Secrets and variables -> Actions -> Variables):
#   RAILWAY_SERVICE -> the backend service name, if the project has more than one service.
#
# `railway up` uploads the checked-out repo and builds it with railway.json
# (npm install + prisma generate + build:backend), then runs the start command
# `prisma migrate deploy && node backend/dist/server.js` — so migrations are applied
# automatically on each deploy.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'prisma/**'
      - 'railway.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only target preflight, or deployment of this exact main commit
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: railway-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.66.0

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --ci --service "$RAILWAY_SERVICE"
          else
            railway up --ci
          fi

  demo:
    # The demo token never enters the production job or untrusted PR code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: 'glistening-friendship / demo'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Test exact demo release guards without credentials
        run: node --test agent-team/tests/bug-pipeline/demo-deployment.test.mjs

      - name: Verify dedicated demo token, source and domain before any deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node agent-team/src/bug-pipeline/demo-deployment.mjs preflight-exact

      - name: Publish immutable read-only target preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-preflight-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Deploy exact main commit and prove it is served by the demo
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node agent-team/src/bug-pipeline/demo-deployment.mjs deploy-exact

      - name: Publish immutable live demo deployment proof
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-deployment-receipt.json
          if-no-files-found: error
          retention-days: 30
