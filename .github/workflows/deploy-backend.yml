name: Remove authorized fake data and maintenance backup

# Restricted maintenance branch. Must not replace main's deploy workflow.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit maintenance operation for the already authorized synthetic data
        type: choice
        default: snapshots
        options:
          - snapshots
          - backup
          - online
          - full
          - observe
          - demo-inventory
          - demo-cleanup
          - demo-online-verify
          - demo-storage-inspect
      reviewed_sha:
        description: Exact reviewed maintenance branch SHA, required only for demo-storage-inspect
        type: string
        required: false

permissions:
  contents: read

jobs:
  demo-storage-inspect:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'l2v-hub/ClinicOS' &&
      github.ref == 'refs/heads/codex/demo-470-completion' &&
      inputs.operation == 'demo-storage-inspect' &&
      inputs.reviewed_sha == github.sha
    concurrency:
      group: demo-storage-inspect
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/maintenance
            .github/workflows
          filter: blob:none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test the actual read-only binding and diagnostic without credentials
        run: node --test scripts/maintenance/demo-storage-inspect.test.mjs
      - name: Install pinned read-only maintenance CLI without credentials
        run: npm install -g @railway/cli@5.66.0
      - name: Inspect only the reviewed demo storage binding and snapshot counts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DEMO_STORAGE_OPERATION: ${{ inputs.operation }}
          DEMO_STORAGE_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node scripts/maintenance/demo-storage-inspect.mjs
  demo-inventory:
    if: github.ref_name == 'codex/demo-470-completion' && inputs.operation == 'demo-inventory'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
      - run: npm install -g @railway/cli@5.66.0
        timeout-minutes: 1
      - name: Inventory the verified demo database without reading clinical rows
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node scripts/maintenance/demo-patient-inventory.mjs
  demo-cleanup:
    if: github.ref_name == 'codex/demo-470-completion' && inputs.operation == 'demo-cleanup'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
      - run: npm install -g @railway/cli@5.66.0
        timeout-minutes: 1
      - name: demo-cleanup
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node scripts/maintenance/demo-patient-cleanup-authorized.mjs
  demo-storage-backups:
    concurrency:
      group: railway-backend
      cancel-in-progress: false
    needs: demo-cleanup
    if: github.ref_name == 'codex/demo-470-completion' && inputs.operation == 'demo-cleanup'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
      - run: npm install -g @railway/cli@5.66.0
        timeout-minutes: 1
      - name: demo-storage-backups
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node scripts/maintenance/demo-storage-backups.mjs --erase
  demo-post-inventory:
    needs: [demo-cleanup, demo-storage-backups]
    if: always() && github.ref_name == 'codex/demo-470-completion' && inputs.operation == 'demo-cleanup' && needs.demo-cleanup.result == 'success'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
      - run: npm install -g @railway/cli@5.66.0
        timeout-minutes: 1
      - name: demo-post-inventory
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node scripts/maintenance/demo-patient-inventory.mjs
  demo-online-browser:
    needs: [demo-cleanup, demo-storage-backups, demo-post-inventory]
    if: always() && github.ref_name == 'codex/demo-470-completion' && (inputs.operation == 'demo-online-verify' || (inputs.operation == 'demo-cleanup' && needs.demo-post-inventory.result == 'success'))
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
      - name: Install pinned browser with standard TLS
        timeout-minutes: 6
        run: |
          npm install --prefix "$RUNNER_TEMP/clinicos-demo-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/clinicos-demo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify actual online demo and revoke the test session
        id: online_verification
        timeout-minutes: 4
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/clinicos-demo-browser/node_modules/playwright/index.mjs
        run: node scripts/maintenance/demo-online-empty-browser.mjs
      - name: Independently verify the completed published bundle
        id: online_artifact_gate
        if: success() && steps.online_verification.outcome == 'success'
        timeout-minutes: 1
        run: node scripts/maintenance/demo-online-empty-browser.mjs --check-published
      - uses: actions/upload-artifact@v4
        if: success() && steps.online_verification.outcome == 'success' && steps.online_artifact_gate.outcome == 'success'
        timeout-minutes: 1
        with:
          name: demo-470-actual-online-${{ github.run_id }}
          path: artifacts/task-validation/maintenance-470/actual-online/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: demo-470-online-failure-${{ github.run_id }}
          path: artifacts/task-validation/maintenance-470/actual-online-failure.json
          if-no-files-found: ignore
          retention-days: 7
  backup-cleanup:
    if: github.ref_name == 'codex/production-inventory-2026-10-13' && (inputs.operation == 'backup' || inputs.operation == 'full')
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / production'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned maintenance CLI
        run: npm install -g @railway/cli@5.66.0
      - name: Erase only the synthetic maintenance backup and verify persistence
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/maintenance/erase-authorized-fake-backup.mjs
  online-cleanup:
    if: github.ref_name == 'codex/production-inventory-2026-10-13' && (inputs.operation == 'online' || inputs.operation == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Delete synthetic patients through the supported online API
        run: node scripts/maintenance/online-fake-patients-cleanup.mjs
  demo-binding-recheck:
    if: github.ref_name == 'codex/production-inventory-2026-10-13' && (inputs.operation == 'online' || inputs.operation == 'full')
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @railway/cli@5.66.0
      - name: Recheck the binding for the actual online database
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node scripts/maintenance/railway-demo-target-inspect.mjs
  native-snapshots:
    if: always() && github.ref_name == 'codex/production-inventory-2026-10-13' && (inputs.operation == 'snapshots' || (inputs.operation == 'full' && needs.backup-cleanup.result == 'success'))
    needs: backup-cleanup
    # A skipped backup job is expected for the standalone snapshot operation.
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / production'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect and remove synthetic snapshots on the two verified volumes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/maintenance/remove-fake-native-snapshots.mjs
  inspect-worker:
    if: github.ref_name == 'codex/production-inventory-2026-10-13' && inputs.operation == 'observe'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / production'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @railway/cli@5.66.0
      - name: Inspect only the current private backup worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/maintenance/inspect-backup-erase-worker.mjs
