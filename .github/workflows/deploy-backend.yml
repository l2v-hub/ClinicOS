name: Authorized production maintenance verification

# Restricted maintenance branch. The authorized cleanup is complete; verify only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'codex/production-inventory-2026-10-13'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the live frontend alias against the cleaned database binding
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_DEMO_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
          RAILWAY_TOKEN_DEMO: ${{ secrets.RAILWAY_TOKEN_DEMO }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          npm install -g @railway/cli@5.66.0
          node -e 'console.log(JSON.stringify({credentialBindingPresence:Object.fromEntries(["RAILWAY_TOKEN","RAILWAY_DEMO_TOKEN","RAILWAY_TOKEN_DEMO","RAILWAY_API_TOKEN"].map(k=>[k,Boolean(process.env[k])]))}))'
          node scripts/maintenance/railway-live-target-inspect.mjs
