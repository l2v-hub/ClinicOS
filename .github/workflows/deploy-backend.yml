name: Authorized production maintenance verification

# Restricted maintenance branch. The authorized cleanup is complete; verify only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'codex/production-inventory-2026-10-13'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install supported browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/clinicos-readonly-browser" --ignore-scripts --no-audit --no-fund playwright@1.61.1
          node "$RUNNER_TEMP/clinicos-readonly-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Read the actual online patient list without clinical writes
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/clinicos-readonly-browser/node_modules/playwright/index.mjs
          CLINICOS_ONLINE_BACKEND_ORIGIN: https://clinicos-backend-demo.up.railway.app
          SIMULATOR_ID: SIM-DOCTOR-1
        run: node scripts/maintenance/production-online-readonly.mjs
