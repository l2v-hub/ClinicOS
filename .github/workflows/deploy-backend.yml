name: Read-only inspection of the actual online cleanup target

# Restricted maintenance branch. Production is clean; the online demo target is pending.
# This branch's workflow is diagnostic only and must not replace main's deploy workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'codex/production-inventory-2026-10-13'
    runs-on: ubuntu-latest
    environment: 'glistening-friendship / demo'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned maintenance CLI
        run: npm install -g @railway/cli@5.66.0
      - name: Verify the newly connected token belongs to the live demo backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
        run: node scripts/maintenance/railway-demo-target-inspect.mjs
