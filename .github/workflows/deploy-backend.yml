name: Production read-only inventory diagnosis

# Diagnostic branch only. No deploy, migration, seed, backup export or deletion.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'codex/production-inventory-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/maintenance
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.66.0
      - name: Inventory production through a temporary private read-only job
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          node scripts/maintenance/railway-private-inventory-runner.mjs
