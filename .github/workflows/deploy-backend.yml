name: Production read-only inventory diagnosis

# Diagnostic branch only. No deploy, migration, seed, backup export or deletion.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'codex/production-inventory-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.66.0
      - name: Inspect supported maintenance commands
        run: |
          railway --help
          railway add --help
          railway service --help
          railway up --help
          railway volume --help
