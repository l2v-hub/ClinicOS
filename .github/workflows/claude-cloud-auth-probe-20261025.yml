name: Inspect Claude cloud credential format without values
on:
  push:
    branches: [codex/claude-cloud-auth-probe-20261025]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'l2v-hub/ClinicOS' && github.ref == 'refs/heads/codex/claude-cloud-auth-probe-20261025'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Inspect only credential shape metadata
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const raw=process.env.CLAUDE_CODE_OAUTH_TOKEN||'';
          const trimmed=raw.trim();
          const single=/^sk-ant-oat01-[A-Za-z0-9_-]+$/;
          let candidate=trimmed;
          if((candidate.startsWith('"')&&candidate.endsWith('"'))||(candidate.startsWith("'")&&candidate.endsWith("'")))candidate=candidate.slice(1,-1).trim();
          if(candidate.startsWith('```')&&candidate.endsWith('```'))candidate=candidate.slice(3,-3).trim();
          if(candidate.startsWith('`')&&candidate.endsWith('`'))candidate=candidate.slice(1,-1).trim();
          const assignment=/^(?:export[ \t]+)?CLAUDE_CODE_OAUTH_TOKEN=(?:"(sk-ant-oat01-[A-Za-z0-9_-]+)"|'(sk-ant-oat01-[A-Za-z0-9_-]+)'|(sk-ant-oat01-[A-Za-z0-9_-]+))$/;
          const m=assignment.exec(candidate);if(m)candidate=m[1]||m[2]||m[3];
          const p={schemaVersion:1,runId:process.env.GITHUB_RUN_ID,workflowSha:process.env.GITHUB_SHA,observedAt:new Date().toISOString(),tokenPresent:Boolean(raw),plainOAuthShape:single.test(raw),trimmedOAuthShape:single.test(trimmed),apiKeyInsteadOfOAuth:/^sk-ant-api/.test(trimmed),copyWrapperRecoverable:raw!==candidate&&single.test(candidate),unrecognizedFormat:Boolean(raw)&&!single.test(candidate)&&!/^sk-ant-api/.test(trimmed),providerCalled:false,credentialValuesPublished:false};
          writeFileSync(process.env.RUNNER_TEMP+'/claude-auth-format.json',JSON.stringify(p,null,2)+'\n',{mode:0o600});console.log(JSON.stringify(p));
          JS
      - name: Preserve nonsecret format flags
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-cloud-auth-format-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-auth-format.json
          retention-days: 14
