name: Fixed PR498 GitHub job-log diagnostic

on:
  push:
    branches: [codex/cloud-fixed-log-read-498-20261022]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: fixed-log-read498
  cancel-in-progress: false

jobs:
  read-fixed-logs:
    if: >-
      github.repository == 'l2v-hub/ClinicOS' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/cloud-fixed-log-read-498-20261022' &&
      github.workflow_ref == 'l2v-hub/ClinicOS/.github/workflows/cloud-fixed-log-read-498-20261022.yml@refs/heads/codex/cloud-fixed-log-read-498-20261022' &&
      github.actor == 'l2v-hub' &&
      github.triggering_actor == 'l2v-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: read
        name: Read fixed native and topology job metadata/logs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FIXED_READER_B64: 
          FIXED_READER_SHA256: 679cbc8dce8d4c69bde3c083eb867b7c20de97c383f8ee6148e0f9038095c502
        run: |
          set -eu
          reader="$RUNNER_TEMP/fixed-log-reader498.mjs"
          printf '%s' "$FIXED_READER_B64" | base64 --decode > "$reader"
          printf '%s  %s\n' "$FIXED_READER_SHA256" "$reader" | sha256sum --check --status
          node "$reader"
      - name: Post the validated fixed diagnostic to PR 498
        if: steps.read.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          const commentFile = join(process.env.RUNNER_TEMP, 'fixed-log-read498-comment.json');
          let payload;
          try { payload = JSON.parse(await readFile(commentFile, 'utf8')); }
          catch { process.exit(1); }
          const body = payload?.body;
          if (!payload || Object.keys(payload).length !== 1 || typeof process.env.GH_TOKEN !== 'string' || !process.env.GH_TOKEN ||
              typeof body !== 'string' || body.length > 12000 ||
              !body.startsWith('<!-- codex-bug-pipeline:fixed-log-diagnostic:498:73775bbf:39743466728 -->') ||
              !body.includes('sourceExecuted=false; providerMutation=false; secretValuesPublished=false.') ||
              /https?:\/\/|gh[pousr]_[A-Za-z0-9_]{16,}|github_pat_[A-Za-z0-9_]{16,}|Bearer\s+\S+|\b[A-Z0-9_]*(?:TOKEN|PASSWORD|SECRET|DATABASE_URL|DSN)\b\s*[:=]\s*\S+/i.test(body) ||
              body.includes(process.env.GH_TOKEN)) process.exit(1);
          const result = spawnSync('gh', [
            'api', '-X', 'POST', 'repos/l2v-hub/ClinicOS/issues/498/comments', '--input', commentFile,
          ], { encoding: 'utf8', timeout: 30000, maxBuffer: 65536, env: { PATH: process.env.PATH ?? '', GH_TOKEN: process.env.GH_TOKEN } });
          if (result.error || result.status !== 0) process.exit(1);
          NODE
