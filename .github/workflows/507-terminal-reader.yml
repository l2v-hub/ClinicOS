name: Read exact retained terminal507attempt10
on:
  push:
    branches: [codex/507-terminal-reader-20261027]
    paths:
      - .github/workflows/507-terminal-reader.yml
permissions:
  actions: read
jobs:
  read:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: l2v-hub/ClinicOS
          run-id: 40508290096
          artifact-ids: 12736234492
          merge-multiple: true
          path: ${{ runner.temp }}/fixed507-terminal-input
      - name: Read only fixed retained export without executing artifact content
        shell: bash
        run: |
          set -euo pipefail
          reader="$RUNNER_TEMP/fixed507-terminal-reader.mjs"
          if [ -e "$reader" ] || [ -L "$reader" ]; then exit 1; fi
          cat > "$reader" <<'FIXED_READER'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import {lstat,readdir,readFile,realpath} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {gzipSync} from 'node:zlib';
          import {fileURLToPath} from 'node:url';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const CP='ccbfe182a7e4bc073c8e5a952c2759d233290422a56d619d8cb2b553f2e536d2';
          const SHA='41ccfd9ce93a8f99a8416349f4ea358713e579b3';
          export async function collect(root){
           assert.equal(await realpath(root),path.resolve(root));let entries=0;const manifests=[];
           async function walk(dir){for(const name of await readdir(dir)){assert(++entries<=256);assert(name!=='.'&&name!=='..'&&!name.includes('\\'));const f=path.join(dir,name),s=await lstat(f);assert(!s.isSymbolicLink(),'Artifact symlink refused');if(s.isDirectory())await walk(f);else{assert(s.isFile()&&s.size<=4*1024*1024);if(name==='manifest.json')manifests.push(f);}}}await walk(root);assert.equal(manifests.length,1);const manifestPath=manifests[0],base=path.dirname(manifestPath);assert.equal(path.basename(base),'round-10-qa-'+CP);assert.equal(path.basename(path.dirname(base)),'bug-batch-507');const raw=await readFile(manifestPath);assert(raw.length<=64*1024);const m=JSON.parse(raw);assert.equal(m.schemaVersion,1);assert.equal(m.kind,'partial-failed-code-retention');assert.equal(m.completeness,'allowed-source-and-sanitized-failure-evidence-only');assert.equal(m.batchId,'bug-batch-507');assert.equal(m.round,10);assert.equal(m.failedStep,'qa');assert.equal(m.failureCode,'independent-qa-blocked');assert.equal(m.sourceSha,SHA);assert.equal(m.checkpointSha256,CP);assert(Array.isArray(m.files)&&m.files.length<=40);const files=[],seen=new Set();let total=raw.length;
           async function add(relative,expected){assert(typeof relative==='string'&&!relative.includes('\\')&&!relative.startsWith('/'));assert(relative.split('/').every(s=>s&&s!=='.'&&s!=='..'));assert(!seen.has(relative));seen.add(relative);let f=base;for(const part of relative.split('/')){f=path.join(f,part);assert(!(await lstat(f)).isSymbolicLink());}const s=await lstat(f);assert(s.isFile()&&s.size<=2*1024*1024);assert((await realpath(f)).startsWith(base+path.sep));const b=await readFile(f);assert.equal(b.length,s.size);total+=b.length;assert(total<=4*1024*1024);if(expected){assert.equal(hash(b),expected.sha256);assert.equal(b.length,expected.bytes);}files.push({file:relative,bytes:b.length,sha256:hash(b),base64:b.toString('base64')});return b;}
           for(const f of m.files){assert(typeof f.file==='string'&&/^(frontend\/|e2e\/|artifacts\/task-validation\/bug-batch-507\/)/.test(f.file));assert(!/(^|\/)\.git(\/|$)|(^|\/)\.env(?:\.|$)|(^|\/)node_modules\//.test(f.file));assert.match(f.sha256,/^[a-f0-9]{64}$/);assert(Number.isSafeInteger(f.bytes)&&f.bytes>=0&&f.bytes<=256*1024);await add('files/'+f.file,f);}
           await add('source.patch');assert.equal(m.modelReport.availability,'retained');assert.equal(m.modelReport.exportedPath,'reports/10-qa.json');assert.equal(m.modelReport.status,'blocked');const reportBytes=await add(m.modelReport.exportedPath,m.modelReport);assert(reportBytes.length<=64*1024);const r=JSON.parse(reportBytes);assert.equal(r.schemaVersion,1);assert.equal(r.kind,'terminal-model-result');assert.equal(r.step,'qa');assert.equal(r.round,10);assert.equal(r.status,'blocked');assert(['retained','sanitized','omitted-invalid','omitted-oversized','omitted-unsafe'].includes(r.summaryDisposition));assert(r.summary===null||typeof r.summary==='string'&&Buffer.byteLength(r.summary)<=32768);if(r.summaryDisposition==='retained')assert.equal(hash(r.summary),r.originalSummarySha256);files.push({file:'manifest.json',bytes:raw.length,sha256:hash(raw),base64:raw.toString('base64')});const payload=Buffer.from(JSON.stringify({type:'fixed507-terminal-payload-v1',runId:40508290096,artifactId:12736234492,sourceSha:SHA,checkpointSha256:CP,files}));assert(payload.length<=6*1024*1024);return payload;
          }
          export function stream(raw){const zip=gzipSync(raw,{mtime:0});assert(zip.length<=6*1024*1024);const chunks=[];for(let i=0;i<zip.length;i+=6144)chunks.push(zip.subarray(i,i+6144).toString('base64'));return[JSON.stringify({type:'fixed507-terminal-stream-v1',payloadBytes:raw.length,payloadSha256:hash(raw),gzipBytes:zip.length,gzipSha256:hash(zip),chunkCount:chunks.length}),...chunks.map((data,index)=>JSON.stringify({type:'fixed507-terminal-chunk-v1',index,data}))].join('\n')+'\n';}
          if(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){try{assert.equal(process.env.GITHUB_REPOSITORY,'l2v-hub/ClinicOS');assert.equal(process.env.GITHUB_REF,'refs/heads/codex/507-terminal-reader-20261027');assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');process.stdout.write(stream(await collect(process.argv[2])));}catch{console.error('fixed507-terminal-reader-guard-refused');process.exitCode=1;}}
          FIXED_READER
          node "$reader" "$RUNNER_TEMP/fixed507-terminal-input"
