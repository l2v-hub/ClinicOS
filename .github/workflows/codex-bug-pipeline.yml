name: Codex bug pipeline

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# One controller at a time for this repository. Never cancel a live model session.
concurrency:
  group: codex-bug-pipeline-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  process:
    # Suppress wake-ups caused by the pipeline's own status comments and reviews.
    if: ${{ !((github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- codex-bug-pipeline:')) || (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, '<!-- codex-bug-pipeline:')) || (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '<!-- codex-bug-pipeline:'))) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinicos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      # Always execute the trusted default branch. Never check out a user-controlled issue/PR ref.
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # Install repository dependencies outside the secret-bearing controller step.
      - name: Install repository dependencies
        env:
          HUSKY: 0
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up local mock AI runtime dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install local validation tools
        run: |
          python -m pip install -r clinicos-ai-runtime/requirements.txt
          node node_modules/playwright/cli.js install --with-deps chromium

      # Install only the pinned CLIs outside the checkout. Their install scripts materialize
      # the platform binaries and run before any credentials enter the job environment.
      - name: Install model CLIs
        run: >-
          npm install --prefix "$RUNNER_TEMP/bug-pipeline-tools"
          --no-audit --no-fund --no-save
          @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.301

      - name: Run serialized issue and review controller
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN || github.token }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Max subscription only: never fall back to a separately billed API key.
          CLAUDE_REVIEW_AUTH_MODE: subscription
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Accept an existing setup-token stored under the old secret name only
          # when its OAuth prefix is recognized; API keys are excluded from review.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_PLANNER_MODEL: ${{ vars.CODEX_PLANNER_MODEL || 'gpt-6.1-sol' }}
          CODEX_EXECUTOR_MODEL: ${{ vars.CODEX_EXECUTOR_MODEL || 'auto' }}
          CODEX_SMALL_EXECUTOR_MODEL: ${{ vars.CODEX_SMALL_EXECUTOR_MODEL || 'gpt-6-luna' }}
          CODEX_CLI_PATH: ${{ runner.temp }}/bug-pipeline-tools/node_modules/.bin/codex
          CLAUDE_CLI_PATH: ${{ runner.temp }}/bug-pipeline-tools/node_modules/.bin/claude
        run: node agent-team/src/bug-pipeline/cli.mjs

      - name: Upload sanitized pipeline diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-bug-pipeline-diagnostic-${{ github.run_id }}
          path: agent-team/.runtime/bug-pipeline/diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
