              "agent-team/src/bug-pipeline/github.mjs": "7909a91bd172e067bd4e5d7afc963991dd89d9999c771c6873551834b965b26b",
              "agent-team/src/bug-pipeline/issue-review-communication.mjs": "44a1caf63b8bf114a1bbc8a7d6915e1c0f11282cc1e9574caa9de2c8f466a7b9",
              "agent-team/src/bug-pipeline/operator-authorization.mjs": "c2fba194bbc10e8bf8dbef6cc4a6a5c1f827480865284c83bf0da7e2b5c471e3",
              "agent-team/src/bug-pipeline/operator-ownership.mjs": "15fafef81826c7d7424ce903b73dab8a9ea8d6a19954b62c02c68fd0a117b77d",
              "agent-team/src/bug-pipeline/process.mjs": "be2a2eabe01b9a74a4793c6f99fad5a5562ed1b4edf1069b634e25dd8907ebbf",
              "agent-team/src/bug-pipeline/release.mjs": "774fab99bf5c7c88c74c42a894d08e217c1859fee97be918e144b78ecd5ee2c1",
              "agent-team/src/bug-pipeline/review-policy.mjs": "500124168a97311d658e89f02fd64d88d1d00e562e17c2abf53c7d515d6cf080",
              "agent-team/src/bug-pipeline/routing.mjs": "9c89cf5f3dcde5ff7423efd8110cb07b12a5a5077bba82c8d8ef5f60d053400c",
              "agent-team/src/bug-pipeline/standalone-review.mjs": "0665d6803eca2099884b22e283bcdd9aa60069e1bc282c66b7a23faad6448af6",
              "agent-team/src/bug-pipeline/verification.mjs": "4eb9a32abb129d74ee7694fbfac443f00da9ab2bdd10a6106d2423cb50a41b64",
              "agent-team/src/bug-pipeline/workspace.mjs": "0ea132835f2d32a339711c12c234ef860ccff4921a5512f7976896c10e574a2c",
              "agent-team/src/core/json-schema.mjs": "ff1be260e9ba0450e8cbbe9079302ce538a652a35e479c90e4233bddb0198661",
              "agent-team/src/core/sanitize.mjs": "1a4d2b9565663b3ed5a593cdecf7cbadbd6f9cd6ef296a4b8c1c426b08ca042b",
              "scripts/automation/configure-demo-source.mjs": "3bac135aaecfe5c95b48f38f613f27a0326d8ebb905a4753cb5ecc0d1513264b",
              "scripts/quality-gate/claude-bug-review.mjs": "fa5982c31c10a2e9020141990c218a817b2247e0e9ed46a89a5c1f765827263b",
              "scripts/quality-gate/review-bug-setup.mjs": "e959277f3bb82a0a8f206025b19b15375678743017be62ec032e3a5aa5f485a0"
            }
          }
          FIXED_EXECUTION_CLOSURE
      - name: Verify merged source and install official locked CLI before credentials
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git -C frozen-main rev-parse HEAD)" = "e431990b8e28830972f7f5ab36379e3b1023b9cc" ]
          git -C frozen-main diff --exit-code
          node --input-type=module <<'VERIFY_SOURCE'
          import assert from 'node:assert/strict';
          import { readFile, lstat } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const root = path.join(process.env.GITHUB_WORKSPACE, 'frozen-main');
          const packet = path.join(process.env.RUNNER_TEMP, 'claude-activation');
          const freeze = JSON.parse(await readFile(path.join(packet, 'sourcehashmanifest.json')));
          const closure = JSON.parse(await readFile(path.join(packet, 'execution-closure.json')));
          assert.equal(freeze.code, '2ad07687af6f15b0c551e765875d5dbfc474e5c2');
          assert.equal(closure.sourceSha, 'ba91cdf4bb5411469d6615c7504d1dc359aa5024');
          assert.equal(Object.keys(freeze.sourceManifest).length, 11);
          assert.equal(Object.keys(closure.files).length, 28);
          for (const [file, digest] of Object.entries({ ...freeze.sourceManifest, ...closure.files })) {
            assert.ok(!path.isAbsolute(file) && !file.split('/').includes('..'));
            const target = path.join(root, file);
            assert.ok((await lstat(target)).isFile(), 'Source must be a regular file');
            assert.equal(createHash('sha256').update(await readFile(target)).digest('hex'), digest, file);
          }
          console.log(JSON.stringify({ status: 'merged-source-qualified', changedSourceFiles: 11, executableClosureFiles: 28 }));
          VERIFY_SOURCE
          mkdir -p "$RUNNER_TEMP/claude-cloud-tools"
          cp frozen-main/scripts/automation/claude-cloud-tools/package.json frozen-main/scripts/automation/claude-cloud-tools/package-lock.json "$RUNNER_TEMP/claude-cloud-tools/"
          npm ci --prefix "$RUNNER_TEMP/claude-cloud-tools" --no-audit --no-fund
      - name: Genuine probe then merged-main guards and variable write with readback
        shell: bash
        env:
          CLAUDE_CLI_PATH: ${{ runner.temp }}/claude-cloud-tools/node_modules/.bin/claude
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/claude-activation/activation.mjs" "$GITHUB_WORKSPACE/frozen-main"
      - name: Upload sanitized activation receipt on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-cloud-activation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-cloud-activation-receipt.json
          if-no-files-found: error
          retention-days: 14
