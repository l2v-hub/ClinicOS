name: Diagnose hosted Claude model profile 20261025
'on':
  push:
    branches:
    - codex/claude-cloud-bootstrap-20261025
permissions:
  contents: read
jobs:
  diagnose-profile:
    if: github.repository == 'l2v-hub/ClinicOS' && github.ref == 'refs/heads/codex/claude-cloud-bootstrap-20261025'
    concurrency:
      group: clinicos-claude-cloud-review-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
    - name: Initialize bounded receipt before checkout or installation
      shell: bash
      run: 'set -euo pipefail

        node -e ''require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/claude-cloud-activation-receipt.json", JSON.stringify({status:"activation-not-started",claimed:false,expectedMainSha:"e431990b8e28830972f7f5ab36379e3b1023b9cc",reviewedHeadSha:"ba91cdf4bb5411469d6615c7504d1dc359aa5024"})+"\n", {mode:0o600})''

        '
    - name: Checkout exact normally merged main source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: e431990b8e28830972f7f5ab36379e3b1023b9cc
        path: frozen-main
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Materialize fixed source verification manifests
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/claude-activation\"\ncat > \"$RUNNER_TEMP/claude-activation/sourcehashmanifest.json\" <<'FIXED_SOURCE_MANIFEST'\n{\n  \"code\": \"2ad07687af6f15b0c551e765875d5dbfc474e5c2\",\n  \"base\": \"32b9946adcb3744c5f549600acf6fea6140bcfb9\",\n  \"tree\": \"8affa560f351febed47b85978c2bcdfd15c1b3b5\",\n  \"parents\": [\n    \"df9b51aec0d30bc8b1d0f7ca3c35a1640b2e9c71\",\n    \"32b9946adcb3744c5f549600acf6fea6140bcfb9\"\n  ],\n  \"sourceManifest\": {\n    \".github/workflows/claude-cloud-review.yml\": \"e1bec27ba5fe1263817fc06f42e22aeae99203897a775747c01f7c912093cda4\",\n    \"agent-team/src/bug-pipeline/cloud-review-worker.mjs\": \"2456492ae734a32a4b813f2c82a93fcf4add80fb0c3df2f50ff7e2a31f00107b\",\n    \"agent-team/src/bug-pipeline/comment-review-handoff.mjs\": \"c9ba132c5744b11a4bbb4fcdc58e4b928e0c89c5a736d0b80758db5bbd9cc604\",\n    \"agent-team/src/bug-pipeline/standalone-review.mjs\": \"0665d6803eca2099884b22e283bcdd9aa60069e1bc282c66b7a23faad6448af6\",\n    \"agent-team/tests/bug-pipeline/cloud-review-worker.test.mjs\": \"e2ef6fd1ab784888a6fe8d2e73b005ea0ebffa9a93814234ee4a8f5c1411fd0e\",\n    \"agent-team/tests/bug-pipeline/comment-review-handoff.test.mjs\": \"36395defccd7421912cbe5de57a13c2d3a89d24fc252380f339fd36687ba11e3\",\n    \"agent-team/tests/bug-pipeline/standalone-review.test.mjs\": \"279f60503ef3fc60aaf647b37ecc9e77fbb9ae14091b02a621858d344bd81605\",\n    \"docs/cloud-claude-review.md\": \"1c2e9ae507f0efc7943b9f4efb8775a8533876719ca7a3e056da5850d38c6979\",\n    \"scripts/automation/claude-cloud-tools/package-lock.json\": \"70cf34a9a534c37fbcfa1580cd2da69c749bbaafac97f07f3be8bcf63aefea11\",\n    \"scripts/automation/claude-cloud-tools/package.json\": \"545379c90727ef75e5d7278d8484e36a24f7cc034edd92a56a69b049c7326f59\",\n    \"scripts/quality-gate/claude-bug-review.mjs\": \"fa5982c31c10a2e9020141990c218a817b2247e0e9ed46a89a5c1f765827263b\"\n  },\n  \"integrationNonce\": \"aecf42b7-ead6-4f9c-bfb0-d544632b9d0d\",\n  \"at\": \"2026-10-25T18:09:56.787334+00:00\"\n}\nFIXED_SOURCE_MANIFEST\ncat > \"$RUNNER_TEMP/claude-activation/execution-closure.json\" <<'FIXED_EXECUTION_CLOSURE'\n{\n  \"sourceSha\": \"ba91cdf4bb5411469d6615c7504d1dc359aa5024\",\n  \"files\": {\n    \"agent-team/src/adapters/process-runner.mjs\": \"8bade29dd5161b5d8daf0038165a4138eabd34a4bf7e771f7f04d98177e541ae\",\n    \"agent-team/src/bug-pipeline/attempt-budget.mjs\": \"555b457b375c4fe35b1e73f2081671e951748503adf598cf0312a5ce8d6e6094\",\n    \"agent-team/src/bug-pipeline/claude-review-cron.mjs\": \"5d54688f8187d3fbffa2a1106b52343b3a223b53366119d4b2f7f8c8d49e9d03\",\n    \"agent-team/src/bug-pipeline/cloud-review-worker.mjs\": \"2456492ae734a32a4b813f2c82a93fcf4add80fb0c3df2f50ff7e2a31f00107b\",\n    \"agent-team/src/bug-pipeline/comment-review-handoff.mjs\": \"c9ba132c5744b11a4bbb4fcdc58e4b928e0c89c5a736d0b80758db5bbd9cc604\",\n    \"agent-team/src/bug-pipeline/contracts.mjs\": \"084599442394406bd89ee5ae7c4a25417c48da47adbfbc281dc533ad511d1482\",\n    \"agent-team/src/bug-pipeline/demo-deployment.mjs\": \"873f90f8885652f0533b1a5983f9f15fb61b5b578103bcbdc6ee7f9f0cd850cf\",\n    \"agent-team/src/bug-pipeline/evidence-limits.mjs\": \"78ddc3908b941ef895aeef8e6416b68e1e110d0852b57f0f331b42fe127d237b\",\n    \"agent-team/src/bug-pipeline/evidence.mjs\": \"9ddfd51b9fa2bff9e4a626a11301457afa5ff3ed52b612205329c214af293d1b\",\n    \"agent-team/src/bug-pipeline/exact-demo-dispatch.mjs\": \"41967d487d283eda67a2052904c8116dc2fc04c5bb8df5cc575d039eed9bb673\",\n    \"agent-team/src/bug-pipeline/exact-demo-recovery.mjs\": \"9ec8ef543bca46fb0cfd88540aaf66de77d5b81dc9d9706286c3920bfa3673bd\",\n    \"agent-team/src/bug-pipeline/external-review.mjs\": \"abd2e1fc05fe9d6dd616a28e2a0413b9ebb5a463bc4586ef24507b1320be299b\",\n    \"agent-team/src/bug-pipeline/github.mjs\": \"7909a91bd172e067bd4e5d7afc963991dd89d9999c771c6873551834b965b26b\",\n    \"agent-team/src/bug-pipeline/issue-review-communication.mjs\": \"44a1caf63b8bf114a1bbc8a7d6915e1c0f11282cc1e9574caa9de2c8f466a7b9\",\n    \"agent-team/src/bug-pipeline/operator-authorization.mjs\": \"c2fba194bbc10e8bf8dbef6cc4a6a5c1f827480865284c83bf0da7e2b5c471e3\",\n    \"agent-team/src/bug-pipeline/operator-ownership.mjs\": \"15fafef81826c7d7424ce903b73dab8a9ea8d6a19954b62c02c68fd0a117b77d\",\n    \"agent-team/src/bug-pipeline/process.mjs\": \"be2a2eabe01b9a74a4793c6f99fad5a5562ed1b4edf1069b634e25dd8907ebbf\",\n    \"agent-team/src/bug-pipeline/release.mjs\": \"774fab99bf5c7c88c74c42a894d08e217c1859fee97be918e144b78ecd5ee2c1\",\n    \"agent-team/src/bug-pipeline/review-policy.mjs\": \"500124168a97311d658e89f02fd64d88d1d00e562e17c2abf53c7d515d6cf080\",\n    \"agent-team/src/bug-pipeline/routing.mjs\": \"9c89cf5f3dcde5ff7423efd8110cb07b12a5a5077bba82c8d8ef5f60d053400c\",\n    \"agent-team/src/bug-pipeline/standalone-review.mjs\": \"0665d6803eca2099884b22e283bcdd9aa60069e1bc282c66b7a23faad6448af6\",\n    \"agent-team/src/bug-pipeline/verification.mjs\": \"4eb9a32abb129d74ee7694fbfac443f00da9ab2bdd10a6106d2423cb50a41b64\",\n    \"agent-team/src/bug-pipeline/workspace.mjs\": \"0ea132835f2d32a339711c12c234ef860ccff4921a5512f7976896c10e574a2c\",\n    \"agent-team/src/core/json-schema.mjs\": \"ff1be260e9ba0450e8cbbe9079302ce538a652a35e479c90e4233bddb0198661\",\n    \"agent-team/src/core/sanitize.mjs\": \"1a4d2b9565663b3ed5a593cdecf7cbadbd6f9cd6ef296a4b8c1c426b08ca042b\",\n    \"scripts/automation/configure-demo-source.mjs\": \"3bac135aaecfe5c95b48f38f613f27a0326d8ebb905a4753cb5ecc0d1513264b\",\n    \"scripts/quality-gate/claude-bug-review.mjs\": \"fa5982c31c10a2e9020141990c218a817b2247e0e9ed46a89a5c1f765827263b\",\n    \"scripts/quality-gate/review-bug-setup.mjs\": \"e959277f3bb82a0a8f206025b19b15375678743017be62ec032e3a5aa5f485a0\"\n  }\n}\nFIXED_EXECUTION_CLOSURE\n"
    - name: Verify merged source and install official locked CLI before credentials
      shell: bash
      run: "set -euo pipefail\n[ \"$(git -C frozen-main rev-parse HEAD)\" = \"e431990b8e28830972f7f5ab36379e3b1023b9cc\" ]\ngit -C frozen-main diff --exit-code\nnode --input-type=module <<'VERIFY_SOURCE'\nimport assert from 'node:assert/strict';\nimport { readFile, lstat } from 'node:fs/promises';\nimport { createHash } from 'node:crypto';\nimport path from 'node:path';\nconst root = path.join(process.env.GITHUB_WORKSPACE, 'frozen-main');\nconst packet = path.join(process.env.RUNNER_TEMP, 'claude-activation');\nconst freeze = JSON.parse(await readFile(path.join(packet, 'sourcehashmanifest.json')));\nconst closure = JSON.parse(await readFile(path.join(packet, 'execution-closure.json')));\nassert.equal(freeze.code, '2ad07687af6f15b0c551e765875d5dbfc474e5c2');\nassert.equal(closure.sourceSha, 'ba91cdf4bb5411469d6615c7504d1dc359aa5024');\nassert.equal(Object.keys(freeze.sourceManifest).length, 11);\nassert.equal(Object.keys(closure.files).length, 28);\nfor (const [file, digest] of Object.entries({ ...freeze.sourceManifest, ...closure.files })) {\n  assert.ok(!path.isAbsolute(file) && !file.split('/').includes('..'));\n  const target = path.join(root, file);\n  assert.ok((await lstat(target)).isFile(), 'Source must be a regular file');\n  assert.equal(createHash('sha256').update(await readFile(target)).digest('hex'), digest, file);\n}\nconsole.log(JSON.stringify({ status: 'merged-source-qualified', changedSourceFiles: 11, executableClosureFiles: 28 }));\nVERIFY_SOURCE\nmkdir -p \"$RUNNER_TEMP/claude-cloud-tools\"\ncp frozen-main/scripts/automation/claude-cloud-tools/package.json frozen-main/scripts/automation/claude-cloud-tools/package-lock.json \"$RUNNER_TEMP/claude-cloud-tools/\"\nnpm ci --prefix \"$RUNNER_TEMP/claude-cloud-tools\" --no-audit --no-fund\n"
    - name: Diagnose actual isolated Opus profile with sanitized output
      shell: bash
      env:
        CLAUDE_CLI_PATH: ${{ runner.temp }}/claude-cloud-tools/node_modules/.bin/claude
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      run: 'node --input-type=module <<''SCOPED_PROFILE_DIAG''

        import assert from ''node:assert/strict'';

        import {mkdtemp,mkdir,writeFile} from ''node:fs/promises'';

        import path from ''node:path'';

        import {pathToFileURL} from ''node:url'';

        const main=''e431990b8e28830972f7f5ab36379e3b1023b9cc'';

        assert.equal(process.env.GITHUB_REPOSITORY,''l2v-hub/ClinicOS'');

        assert.equal(process.env.GITHUB_EVENT_NAME,''push'');

        assert.equal(process.env.GITHUB_REF,''refs/heads/codex/claude-cloud-bootstrap-20261025'');

        const source=path.join(process.env.GITHUB_WORKSPACE,''frozen-main'');

        const {probeCloudClaude}=await import(pathToFileURL(path.join(source,''agent-team/src/bug-pipeline/cloud-review-worker.mjs'')));

        const {createRunner}=await import(pathToFileURL(path.join(source,''agent-team/src/bug-pipeline/process.mjs'')));

        const {claudeFailureCode}=await import(pathToFileURL(path.join(source,''agent-team/src/bug-pipeline/claude-review-cron.mjs'')));

        const root=await mkdtemp(path.join(process.env.RUNNER_TEMP,''cloud-profile-diagnostic-'')),cwd=path.join(root,''empty'');await mkdir(cwd);

        const env=Object.fromEntries([''PATH'',''HOME'',''CLAUDE_CLI_PATH'',''CLAUDE_CODE_OAUTH_TOKEN''].filter(k=>process.env[k]!==undefined).map(k=>[k,process.env[k]]));env.CLAUDE_REVIEW_AUTH_MODE=''subscription'';

        const execute=createRunner({env,runtimeRoot:root});

        const proof={schemaVersion:1,type:''cloud-profile-diagnostic'',sourceMain:main,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,qualified:false,reviewClaims:0,variableWrites:0,inferenceCalls:0};

        const run=async job=>{assert.equal(job.command,''claude'');assert.equal(job.envMode,''review'');const r=await execute(job);if(job.args[0]===''--version''){proof.versionQualified=r.ok&&r.stdout.trim().startsWith(''2.1.301 '');return r;}proof.inferenceCalls++;proof.processOk=Boolean(r.ok);proof.exitCode=Number.isInteger(r.code)?r.code:null;proof.processFailure=[''timeout'',''output-limit'',''spawn-error'',''subscription-oauth-required''].includes(r.error)?r.error:null;proof.failureCode=claudeFailureCode(r);let e;try{e=JSON.parse(r.stdout)}catch{}proof.envelopeParsed=Boolean(e);proof.isError=e?.is_error===true;proof.structuredOutputPresent=Boolean(e?.structured_output);proof.structuredStatusOk=e?.structured_output?.status===''ok'';proof.models=Object.entries(e?.modelUsage??{}).filter(([k])=>/^claude-(?:opus|sonnet|haiku)-[0-9]+(?:-[0-9]+){1,3}(?:\[1m\])?$/.test(k)).slice(0,8).map(([model,v])=>({model,contextWindow:Number.isSafeInteger(v?.contextWindow)?v.contextWindow:null,maxOutputTokens:Number.isSafeInteger(v?.maxOutputTokens)?v.maxOutputTokens:null}));const text=r.stdout+'' ''+r.stderr;proof.hints={authRejected:/authentication_error|invalid oauth|not logged in|unauthorized/i.test(text),rateLimited:/rate_limit|usage limit|limit reached|quota/i.test(text),unsupportedModel:/model.*(?:not found|not available|not supported)|(?:unavailable|unsupported).*model/i.test(text),unsupportedArgument:/unknown option|unknown argument|unrecognized option/i.test(text),unavailable1MContext:/1m.*(?:not available|not supported|unavailable)|(?:unavailable|not supported).*1m|extended.context.*(?:not|unavailable)/i.test(text),permissionOrScope:/permission|forbidden|scope/i.test(text)};return r;};

        try{const q=await probeCloudClaude({env,run,cwd});assert.equal(q.status,''probe-passed'');const p=q.profile;assert.match(p.model,/^claude-(?:opus|sonnet|haiku)-[0-9]+(?:-[0-9]+){1,3}(?:\[1m\])?$/);assert(Number.isSafeInteger(p.contextWindow)&&p.contextWindow>0&&Number.isSafeInteger(p.maxOutputTokens)&&p.maxOutputTokens>0);proof.profile={model:p.model,contextWindow:p.contextWindow,maxOutputTokens:p.maxOutputTokens};proof.qualified=true;}catch{proof.assertionFailed=true;proof.qualified=false;}

        await writeFile(path.join(process.env.RUNNER_TEMP,''claude-cloud-activation-receipt.json''),JSON.stringify(proof,null,2)+''\n'',{mode:0o600});console.log(JSON.stringify(proof));if(!proof.qualified)process.exitCode=1;

        SCOPED_PROFILE_DIAG

        '
    - name: Upload sanitized activation receipt on every outcome
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: claude-cloud-activation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/claude-cloud-activation-receipt.json
        if-no-files-found: error
        retention-days: '14'
