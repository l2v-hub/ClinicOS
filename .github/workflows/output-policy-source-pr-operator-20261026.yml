name: Publish and hand off verified output-policy source
on:
  push:
    branches: [codex/output-policy-source-pr-operator-20261026]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
concurrency:
  group: clinicos-output-policy-source-pr-operator-20261026
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'l2v-hub/ClinicOS' && github.ref == 'refs/heads/codex/output-policy-source-pr-operator-20261026' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 995e2ff6d14a96b5d67e0d14d708f4a95c4c816f
          persist-credentials: false
          sparse-checkout: |
            agent-team
            scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Materialize and syntax-check exact operator before credentials
        run: |
          mkdir -p "$RUNNER_TEMP/output-policy-operator"
          cat > "$RUNNER_TEMP/output-policy-operator/operator.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdtemp, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          
          const REPO = 'l2v-hub/ClinicOS';
          const MAIN = '995e2ff6d14a96b5d67e0d14d708f4a95c4c816f';
          const HEAD = 'b868e72ceb2d2e29fdaf077b3d7144c34481e176';
          const BRANCH = 'codex/codex-model-output-policy-20261026';
          const OPERATOR_BRANCH = 'codex/output-policy-source-pr-operator-20261026';
          const NONCE = '8e678bd0-fc68-42e4-9c9c-063321cc7924';
          const MANIFEST = JSON.parse(Buffer.from('', 'base64').toString('utf8'));
          const REQUIRED = ['bug-pipeline-tests', 'secret-scan', 'frontend-tests', 'archive-tests', 'gate', 'browser-e2e'];
          const trusted = process.cwd();
          const digest = value => createHash('sha256').update(value).digest('hex');
          const proof = { schemaVersion: 1, nonce: NONCE, repository: REPO, sourceMain: MAIN,
            sourceHead: HEAD, sourceBranch: BRANCH, operatorBranch: OPERATOR_BRANCH,
            operatorSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, stage: 'initializing',
            prCreatesUsed: 0, reviewRequestsUsed: 0, mergeCalls: 0, providerCalls: 0 };
          let receiptParent = process.env.GITHUB_SHA;
          let receiptAvailable = false;
          
          async function api(token, endpoint, method = 'GET', body) {
            assert(endpoint === `repos/${REPO}` || endpoint.startsWith(`repos/${REPO}/`) || endpoint === 'user');
            assert(['GET', 'POST', 'PATCH'].includes(method));
            let response;
            try {
              response = await fetch(`https://api.github.com/${endpoint}`, {
                method, redirect: 'error', signal: AbortSignal.timeout(30000),
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
                ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              });
            } catch { throw Object.assign(new Error('operator-transport-unknown'), { finiteCode: 'transport-unknown' }); }
            if (!response.ok) throw Object.assign(new Error('operator-http-failed'), {
              finiteCode: 'http-failed', httpStatus: response.status,
            });
            if (response.status === 204) return null;
            const text = await response.text();
            assert(Buffer.byteLength(text) <= 16 * 1024 * 1024, 'Operator API response bound');
            return JSON.parse(text);
          }
          
          async function persistProof() {
            const token = process.env.RECEIPT_GH_TOKEN;
            assert(token);
            const refEndpoint = `repos/${REPO}/git/ref/heads/${OPERATOR_BRANCH}`;
            const writeRefEndpoint = `repos/${REPO}/git/refs/heads/${OPERATOR_BRANCH}`;
            const ref = await api(token, refEndpoint);
            assert.equal(ref.object.sha, receiptParent, 'Receipt branch changed; no retry');
            const parent = await api(token, `repos/${REPO}/git/commits/${receiptParent}`);
            const content = JSON.stringify({ ...proof, observedAt: new Date().toISOString() }, null, 2) + '\n';
            assert(Buffer.byteLength(content) <= 32768);
            const blob = await api(token, `repos/${REPO}/git/blobs`, 'POST', { content, encoding: 'utf-8' });
            const tree = await api(token, `repos/${REPO}/git/trees`, 'POST', {
              base_tree: parent.tree.sha,
              tree: [{ path: 'operator-output-policy-receipt.json', mode: '100644', type: 'blob', sha: blob.sha }],
            });
            const commit = await api(token, `repos/${REPO}/git/commits`, 'POST', {
              message: 'chore: preserve finite output-policy operator receipt', tree: tree.sha,
              parents: [receiptParent],
            });
            assert.equal((await api(token, refEndpoint)).object.sha, receiptParent, 'Receipt CAS changed');
            await api(token, writeRefEndpoint, 'PATCH', { sha: commit.sha, force: false });
            assert.equal((await api(token, refEndpoint)).object.sha, commit.sha, 'Receipt readback failed');
            receiptParent = commit.sha;
            receiptAvailable = true;
            console.log(JSON.stringify({ type: 'finite-operator-proof', ...proof, receiptCommit: receiptParent }));
          }
          
          try {
            assert.equal(process.env.GITHUB_REPOSITORY, REPO);
            assert.equal(process.env.GITHUB_REF, `refs/heads/${OPERATOR_BRANCH}`);
            assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
            assert.match(process.env.GITHUB_RUN_ID, /^[0-9]{1,20}$/);
            assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'Reruns require independent reconciliation');
            assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { cwd: trusted, encoding: 'utf8' }).trim(), MAIN);
            assert.equal(MANIFEST.sha, HEAD);
            assert.equal(MANIFEST.baseSha, MAIN);
            assert.equal(MANIFEST.branch, BRANCH);
            assert(!MANIFEST.pr, 'Returned actual PR identity is required');
            assert(process.env.GH_TOKEN);
            const temp = await mkdtemp(path.join(process.env.RUNNER_TEMP, 'output-policy-operator-'));
            await mkdir(path.join(temp, 'home'), { mode: 0o700 });
            const loadTrusted = relative => import(pathToFileURL(path.join(trusted, relative)).href);
            const { createRunner } = await loadTrusted('agent-team/src/bug-pipeline/process.mjs');
            const { createGitHub, MAX_DURABLE_STATE_BYTES, pendingResultBytes } = await loadTrusted('agent-team/src/bug-pipeline/github.mjs');
            const { validateState } = await loadTrusted('agent-team/src/bug-pipeline/contracts.mjs');
            const { validateOperatorContinuations } = await loadTrusted('agent-team/src/bug-pipeline/attempt-budget.mjs');
            const { createStandaloneReview, validateStandaloneState } = await loadTrusted('agent-team/src/bug-pipeline/standalone-review.mjs');
            const run = createRunner({ env: { PATH: process.env.PATH, HOME: path.join(temp, 'home'),
              GH_TOKEN: process.env.GH_TOKEN }, runtimeRoot: temp });
            const github = createGitHub({ repo: REPO, cwd: trusted, run });
            const controller = createStandaloneReview({ github, run, cwd: trusted });
            const updateState = async edit => {
              const store = github.createStateStore(), before = await store.load(), state = structuredClone(before);
              await edit(state);
              state.updatedAt = new Date().toISOString();
              validateState(state, REPO); validateOperatorContinuations(state); validateStandaloneState(state);
              const bytes = Buffer.byteLength(JSON.stringify(state) + '\n');
              const pending = [...state.batches, ...(state.manualBatches ?? []), ...state.standaloneReviews]
                .reduce((sum, subject) => sum + pendingResultBytes(subject), 0);
              assert(bytes + pending <= MAX_DURABLE_STATE_BYTES, 'Official 8 MiB including pending results');
              await store.save(state, { guard: async () => {
                assert.deepEqual(await github.createStateStore().load(), before, 'Concurrent state owner; no retry');
                return true;
              } });
              assert.deepEqual(await github.createStateStore().load(), state, 'State readback differs');
            };
            const diagnostic = state => state.operatorInfrastructureFollowups
              .find(item => item.id === 'claude-hosted-activation-20261025').codexExecutionDiagnostics;
            proof.stage = 'credential-read-and-execution-intent';
            await persistProof();
            const token = process.env.GH_TOKEN;
            const repo = await api(token, `repos/${REPO}`);
            assert.equal(repo.full_name, REPO);
            assert.equal((await api(token, `repos/${REPO}/git/ref/heads/main`)).object.sha, MAIN);
            assert.equal((await api(token, `repos/${REPO}/git/ref/heads/${BRANCH}`)).object.sha, HEAD);
            const existing = await api(token, `repos/${REPO}/pulls?state=all&head=${encodeURIComponent('l2v-hub:' + BRANCH)}&base=main&per_page=100`);
            assert(Array.isArray(existing) && existing.length === 0, 'Existing PR must be reconciled, never duplicated');
            await updateState(state => {
              const d = diagnostic(state), allowance = d.sourcePrOperator;
              assert.equal(d.sourcePublicationReservation.sha, HEAD);
              assert.equal(allowance.nonce, NONCE);
              assert.equal(allowance.operationalCommit, process.env.GITHUB_SHA);
              assert.equal(allowance.maximumExecutions, 1);
              assert.equal(allowance.used, 1, 'Execution was durably consumed before branch push');
              assert.equal(allowance.status, 'consumed-before-operator-push');
              allowance.status = 'running-single-pr-create';
              allowance.startedAt = new Date().toISOString();
            });
            proof.stage = 'single-pr-create-intent';
            proof.prCreatesUsed = 1;
            await persistProof();
            const title = 'fix: bound Codex progress and retain finite execution diagnostics';
            const body = 'Codex model sessions currently terminate after 64 KiB of combined JSON progress, so a legitimate tool read can prevent a valid separately guarded typed result. This change uses the established 2 MiB total ceiling, retains owned 32 KiB tails per stream, keeps fatal 64 KiB stderr and all timeout/process-group/typed-result guards, and records only finite diagnostics.\n\nA real child fixture fails the old policy and passes the new one. Fresh independent QA2 on source 3f1311db reports 1,663 PASS / 0 FAIL / 3 Windows SKIP, focused 26 PASS and independent 16 PASS, including exact backing allocations and adversarial routing/privacy cases. Failed candidate 38, QA1 and all prior failed runs remain in the frozen packet. Original clinical run40249337703 exact cause remains unknown; no clinical recovery or resolution is claimed. Current exact-main real provider qualification40251755127 succeeded.\n\nRoot-owned protected source bootstrap: actual six new-head native checks, native packet verification, genuine Claude cloud review and NEW final Codex precede any ordinary protected manual merge. Automatic release eligibility and hold remain unchanged; no fake human approval/admin bypass.\n\nRefs #455';
            const pr = await api(token, `repos/${REPO}/pulls`, 'POST', { title, body, head: BRANCH, base: 'main', draft: false });
            assert(Number.isSafeInteger(pr.number) && pr.number > 0);
            assert.equal(pr.state, 'open'); assert.equal(pr.head.sha, HEAD);
            assert.equal(pr.head.ref, BRANCH); assert.equal(pr.head.repo.full_name, REPO);
            assert.equal(pr.base.ref, 'main'); assert.equal(pr.base.repo.full_name, REPO);
            assert.equal(pr.head.repo.fork, false);
            assert.equal(pr.html_url, `https://github.com/${REPO}/pull/${pr.number}`);
            proof.prCreateConfirmed = true; proof.prNumber = pr.number; proof.prUrl = pr.html_url;
            await updateState(state => {
              const all = [...state.batches, ...(state.manualBatches ?? []), ...state.standaloneReviews];
              assert(!all.some(subject => subject.pr?.number === pr.number || subject.id === `standalone-pr-${pr.number}`),
                'Unexpected existing native owner; stop, do not clobber');
              const takeover = state.operatorTakeover, automation = takeover.automation;
              assert.equal(takeover.active, true);
              assert.equal(takeover.nonce, '5ef4558e-2243-4380-8330-453cfa1df672');
              assert.equal(automation.mode, 'new-unclaimed-only');
              assert.equal(automation.enabled, true);
              assert.equal(automation.protectedSubjects.length, 30);
              const old = structuredClone(automation.protectedSubjects);
              automation.protectedSubjects.push({ collection: 'standaloneReviews', id: `standalone-pr-${pr.number}`,
                pr: pr.number, shaAtReservation: HEAD, reservedAt: new Date().toISOString(),
                reason: 'Root-owned exact source bootstrap; genuine read-only Claude handoff allowed, automatic Codex source ownership prohibited.' });
              assert.deepEqual(automation.protectedSubjects.slice(0, -1), old);
              diagnostic(state).sourcePrOperator.createdPr = { number: pr.number, url: pr.html_url,
                sha: HEAD, protectedSubject: `standalone-pr-${pr.number}`, registeredAt: new Date().toISOString() };
            });
            proof.stage = 'actual-pr-created-and-root-protected';
            await persistProof();
            let checks;
            let previous = '';
            for (let poll = 0; poll < 80; poll++) {
              assert.equal((await api(token, `repos/${REPO}/pulls/${pr.number}`)).head.sha, HEAD);
              const inventory = await api(token, `repos/${REPO}/commits/${HEAD}/check-runs?per_page=100`);
              checks = REQUIRED.map(name => inventory.check_runs.filter(check => check.name === name
                && check.head_sha === HEAD && check.app?.id === 15368).sort((a, b) => b.id - a.id)[0]);
              proof.checks = checks.map((check, i) => ({ name: REQUIRED[i], id: Number.isSafeInteger(check?.id) ? check.id : null,
                headSha: HEAD, status: ['queued', 'in_progress', 'completed'].includes(check?.status) ? check.status : 'not-started',
                conclusion: check?.conclusion === 'success' ? 'success' : check?.conclusion ? 'not-success' : null }));
              if (checks.some(check => check?.status === 'completed' && check.conclusion !== 'success'))
                throw Object.assign(new Error('native-check-failed'), { finiteCode: 'native-check-failed' });
              const fingerprint = digest(JSON.stringify(proof.checks));
              if (fingerprint !== previous) { proof.stage = 'waiting-exact-six-native-checks'; await persistProof(); previous = fingerprint; }
              if (checks.every(check => check?.status === 'completed' && check.conclusion === 'success')) break;
              if (poll === 79) throw Object.assign(new Error('native-check-deadline'), { finiteCode: 'native-check-deadline' });
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            assert(checks.every(check => check?.head_sha === HEAD && check.app.id === 15368 && check.conclusion === 'success'));
            const manifest = { ...MANIFEST, pr: { number: pr.number, url: pr.html_url } };
            await controller.adopt(manifest);
            const subject = (await controller.load(pr.number)).batch;
            assert.equal(subject.sha, HEAD);
            await controller.verify(subject);
            proof.nativePacketVerified = true;
            proof.stage = 'native-packet-verified-before-handoff';
            await persistProof();
            const evidenceBody = '<!-- codex-bug-pipeline:operator-exact-source-checks -->\nActual exact-head source evidence for ' + HEAD
              + ': all six required GitHub Actions app15368 checks completed SUCCESS.\n```json\n' + JSON.stringify(proof.checks, null, 2)
              + '\n```\nNative standalone controller verified the immutable117-file packet, full source/blob/mode inventory and preserved implementation history. Root-owned protected subject; ready-label projection deferred to the genuine hosted claim. Actual Claude and NEW final Codex remain required; no native human approval or automatic trust-root release is claimed.';
            await api(token, `repos/${REPO}/issues/${pr.number}/comments`, 'POST', { body: evidenceBody });
            proof.stage = 'single-native-review-request-intent';
            proof.reviewRequestsUsed = 1;
            await persistProof();
            const requested = await controller.request(pr.number);
            assert.equal(requested.sha, HEAD);
            assert.match(requested.externalReview.requestId, /^[a-f0-9-]{36}$/);
            proof.reviewRequestsUsed = 1;
            proof.reviewRequestId = requested.externalReview.requestId;
            proof.stage = 'genuine-hosted-review-requested-ready-label-deferred';
            await persistProof();
          } catch (error) {
            const allowed = new Set(['transport-unknown', 'http-failed', 'native-check-failed', 'native-check-deadline']);
            proof.failure = allowed.has(error?.finiteCode) ? error.finiteCode : 'controller-or-binding-failed';
            proof.httpStatus = Number.isInteger(error?.httpStatus) ? error.httpStatus : null;
            proof.failedAtStage = proof.stage;
            proof.stage = 'blocked-preserve-intent-no-replay';
            try { await persistProof(); } catch {
              console.log(JSON.stringify({ type: 'finite-operator-proof', ...proof, receiptAvailable }));
            }
            process.exitCode = 1;
          }
          JS
          node --check "$RUNNER_TEMP/output-policy-operator/operator.mjs"
          node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
          gh --version > /dev/null
      - name: Execute one bound PR and native handoff operation
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN || github.token }}
          RECEIPT_GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/output-policy-operator/operator.mjs"
