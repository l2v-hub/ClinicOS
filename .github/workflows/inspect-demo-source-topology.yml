name: Inspect demo source topology

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed current main commit SHA (read-only inspection)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: demo-source-topology
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'l2v-hub/ClinicOS' &&
      github.ref == 'refs/heads/main' &&
      inputs.reviewed_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: 'glistening-friendship / demo'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test inspector without credentials
        run: node --test scripts/automation/configure-demo-source.test.mjs scripts/automation/inspect-demo-source-topology.test.mjs
      - name: Inspect fixed demo topology without mutation
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEMO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIGURE_DEMO_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          DEMO_TOPOLOGY_OPERATION: inspect
        run: node scripts/automation/inspect-demo-source-topology.mjs
      - name: Publish validated metadata receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-source-topology-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-source-topology-receipt.json
          if-no-files-found: error
          retention-days: 7
