name: Bug pipeline regression gate

on:
  # A main-required check must be emitted for every pull request.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'agent-team/**'
      - 'scripts/quality-gate/**'
      - 'scripts/automation/**'
      - '.github/workflows/*bug*.yml'
  workflow_dispatch:
    inputs:
      configure_repository:
        description: Enable Actions PR creation/approval and add the required main check without replacing protections
        type: boolean
        default: false
      reviewed_sha:
        description: Exact reviewed workflow commit, required only for repository configuration
        type: string
        default: ''
      verify_provider_access:
        description: Check OpenAI model metadata without inference
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-provider-access:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_provider_access && github.repository == 'l2v-hub/ClinicOS'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify read-only model API access on the reviewed revision
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLANNER_MODEL: ${{ vars.CODEX_PLANNER_MODEL || 'gpt-6.1-sol' }}
          CLINICOS_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.match(process.env.CLINICOS_REVIEWED_SHA || '', /^[a-f0-9]{40}$/);
          assert.equal(process.env.GITHUB_SHA, process.env.CLINICOS_REVIEWED_SHA);
          const probes = [
            { name: 'openai-planner-model', url: `https://api.openai.com/v1/models/${encodeURIComponent(process.env.PLANNER_MODEL)}`, headers: { Authorization: `Bearer ${process.env.OPENAI_API_KEY}` }, valid: body => body.id === process.env.PLANNER_MODEL },
          ];
          let failed = false;
          for (const probe of probes) {
            try {
              const response = await fetch(probe.url, { headers: probe.headers, redirect: 'error', signal: AbortSignal.timeout(30000) });
              const verified = response.ok && probe.valid(await response.json());
              console.log(JSON.stringify({ probe: probe.name, httpStatus: response.status, verified }));
              failed ||= !verified;
            } catch {
              console.log(JSON.stringify({ probe: probe.name, verified: false, reason: 'request-failed' }));
              failed = true;
            }
          }
          process.exitCode = failed ? 1 : 0;
          JS

  configure-repository:
    if: github.event_name == 'workflow_dispatch' && inputs.configure_repository && github.repository == 'l2v-hub/ClinicOS'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: clinicos-repository-configuration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply and verify the explicitly authorized repository settings
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
          CLINICOS_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node scripts/quality-gate/configure-bug-repository.mjs

  bug-pipeline-tests:
    needs: windows-review-setup
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Require native Windows setup checks
        env:
          WINDOWS_RESULT: ${{ needs.windows-review-setup.result }}
        run: test "$WINDOWS_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # Report booleans only, even when the GitHub integration cannot list secret metadata.
      - name: Report integration configuration availability
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OPENAI_API_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
          ANTHROPIC_API_KEY_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          CLINICOS_BOT_TOKEN_CONFIGURED: ${{ secrets.CLINICOS_BOT_TOKEN != '' }}
          VERCEL_TOKEN_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' }}
          VERCEL_PROJECT_CONFIGURED: ${{ vars.VERCEL_ORG_ID != '' && vars.VERCEL_PROJECT_ID != '' }}
          RAILWAY_TOKEN_CONFIGURED: ${{ secrets.RAILWAY_TOKEN != '' }}
          AUTO_RELEASE_ENABLED: ${{ vars.BUG_PIPELINE_AUTO_RELEASE == 'true' }}
        run: |
          node --input-type=module <<'JS'
          const names = ['OPENAI_API_KEY_CONFIGURED', 'ANTHROPIC_API_KEY_CONFIGURED', 'CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED', 'CLINICOS_BOT_TOKEN_CONFIGURED', 'VERCEL_TOKEN_CONFIGURED', 'VERCEL_PROJECT_CONFIGURED', 'RAILWAY_TOKEN_CONFIGURED', 'AUTO_RELEASE_ENABLED'];
          console.log(JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name] === 'true']))));
          JS
      # Built-in Node tests, synthetic repositories and mock providers; no app install or secrets.
      - name: Test queue, sessions, evidence, budgets and release guards
        run: node --test agent-team/tests/bug-pipeline/*.test.mjs scripts/quality-gate/claude-bug-review.test.mjs

      # Exercise the actual sandbox on a clean runner; no model call or secrets are needed.
      - name: Install pinned Codex CLI for runner readiness
        run: npm install --prefix "$RUNNER_TEMP/bug-pipeline-tools" --no-audit --no-fund --no-save @openai/codex@0.159.2

      - name: Verify actual isolated Codex sandbox
        env:
          CODEX_CLI_PATH: ${{ runner.temp }}/bug-pipeline-tools/node_modules/.bin/codex
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdtemp, readFile, rm } from 'node:fs/promises';
          import path from 'node:path';
          import { createRunner, childEnvironment } from './agent-team/src/bug-pipeline/process.mjs';
          const runtimeRoot = path.join(process.env.RUNNER_TEMP, 'cli-readiness');
          const run = createRunner({ runtimeRoot });
          const directory = await mkdtemp(path.join(process.cwd(), '.cli-readiness-'));
          const marker = path.join(directory, 'executed.txt');
          const script = `require('node:fs').writeFileSync(${JSON.stringify(marker)}, 'sandbox-ready'); require('node:fs').writeSync(1, 'sandbox-ready');`;
          const args = ['sandbox', '--permission-profile', ':workspace', '--cd', process.cwd(), '--', 'node', '-e', script];
          const result = await run({
            command: 'codex',
            args,
            cwd: process.cwd(),
            envMode: 'verification',
          });
          const direct = spawnSync(process.env.CODEX_CLI_PATH, args, { cwd: process.cwd(), env: childEnvironment('verification', process.env, runtimeRoot), encoding: 'utf8', timeout: 30000 });
          console.log(JSON.stringify({ isolatedRunner: result, directCli: { code: direct.status, stdout: direct.stdout, stderr: direct.stderr, error: direct.error?.code } }));
          if (!result.ok || result.stdout !== 'sandbox-ready' || direct.status !== 0 || direct.stdout !== 'sandbox-ready') {
            console.log(JSON.stringify({ executedMarker: await readFile(marker, 'utf8').catch(() => null), nodeExecutable: process.execPath }));
            for (const [name, command] of [
              ['absolute-echo', ['/bin/echo', 'sandbox-ready']],
              ['failure-exit', ['/bin/sh', '-c', 'exit 7']],
            ]) {
              const probe = await run({ command: 'codex', args: ['sandbox', '--permission-profile', ':workspace', '--cd', process.cwd(), '--', ...command], cwd: process.cwd(), envMode: 'verification' });
              console.log(JSON.stringify({ probe: name, ...probe }));
            }
            const traceFile = path.join(directory, 'sandbox-process.trace');
            const trace = spawnSync('strace', ['-f', '-e', 'trace=execve,wait4', '-s', '200', '-o', traceFile, process.env.CODEX_CLI_PATH, ...args], { cwd: process.cwd(), env: childEnvironment('verification', process.env, runtimeRoot), encoding: 'utf8', timeout: 30000 });
            console.log(JSON.stringify({ traceExit: trace.status, traceError: trace.error?.code, traceStderr: trace.stderr }));
            const lines = (await readFile(traceFile, 'utf8').catch(() => '')).split('\n').filter(line => /execve|SIGSYS|SIGSEGV|exited|killed|EPERM/.test(line));
            console.log(JSON.stringify({ sandboxProcessTrace: lines.slice(-40) }));
          }
          assert.equal(result.ok, true, result.stderr || result.error);
          assert.equal(result.stdout, 'sandbox-ready');
          assert.equal(direct.status, 0, direct.stderr);
          assert.equal(direct.stdout, 'sandbox-ready');
          assert.equal(await readFile(marker, 'utf8'), 'sandbox-ready');
          await rm(directory, { recursive: true });
          console.log('Real isolated Codex sandbox: PASS');
          JS

      - name: Prepare trusted dependencies and PostgreSQL for isolated service readiness
        env:
          HUSKY: 0
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clinicos_test?schema=public
        run: |
          bash scripts/quality-gate/install-verification-tools.sh
          npm ci --ignore-scripts --no-audit --no-fund
          npm run db:generate

      - name: Verify real isolated HTTP and database access with denied external egress
        env:
          CODEX_CLI_PATH: ${{ runner.temp }}/bug-pipeline-tools/node_modules/.bin/codex
        run: node scripts/quality-gate/verify-isolated-services.mjs

  windows-review-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # Synthetic auth/process boundaries; native PowerShell parser and Task Scheduler objects.
      # No provider credentials, actual task registration or subscription inference.
      - name: Verify Windows review setup and native scheduler definitions
        run: node --test agent-team/tests/bug-pipeline/windows-review.test.mjs
