# Author template: literal OPERATOR_PACKET bindings intentionally prevent execution.
# Explicit one-off operator push only. Do not merge this workflow into main.
name: Operator Claude compatibility bugfix 20261025

on:
  push:
    branches: [codex/claude-review-bootstrap-20261025]

permissions:
  contents: read

jobs:
  review-fixed-bugfix:
    if: github.repository == 'l2v-hub/ClinicOS' && github.ref == 'refs/heads/codex/claude-review-bootstrap-20261025'
    concurrency:
      group: clinicos-claude-cloud-review-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Initialize bounded receipt before checkout or installation
        shell: bash
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/claude-review-compat-receipt.json", JSON.stringify({status:"compat-not-started",targetBound:false})+"\n", {mode:0o600})'
      - name: Checkout only fixed trusted main kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4f7b3ae8d13a245f8e25fa7fbb9a31e0d3a9a75b
          path: frozen-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Materialize fixed operator bytes 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-compat"
          : > "$RUNNER_TEMP/claude-compat/payload.b64"
      - name: Materialize fixed operator bytes 1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' >> "$RUNNER_TEMP/claude-compat/payload.b64"
      - name: Materialize fixed operator bytes 2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' >> "$RUNNER_TEMP/claude-compat/payload.b64"
      - name: Materialize fixed operator bytes 3
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' >> "$RUNNER_TEMP/claude-compat/payload.b64"
      - name: Materialize fixed operator bytes 4
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'DECODE_FIXED'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {inflateSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const root=process.env.RUNNER_TEMP+'/claude-compat/';
          const bytes=inflateSync(Buffer.from(readFileSync(root+'payload.b64','utf8'),'base64'),{maxOutputLength:1048576});
          assert.equal(bytes.length,60980);
          assert.equal(createHash('sha256').update(bytes).digest('hex'),'efe43552979fc402a9ffa130a980bd2619a4162d3f3fdece1de78b83977d1552');
          const files=JSON.parse(bytes);
          assert.deepEqual(Object.keys(files),['compat.mjs','operator-packet.json','sourcehashmanifest.json','execution-closure.json']);
          for(const [name,value] of Object.entries(files)) writeFileSync(root+name,Buffer.from(value,'base64'),{mode:0o600});
          DECODE_FIXED
      - name: Verify trusted source and install locked official CLI before credentials
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git -C frozen-source rev-parse HEAD)" = "4f7b3ae8d13a245f8e25fa7fbb9a31e0d3a9a75b" ]
          git -C frozen-source diff --exit-code
          node --input-type=module <<'VERIFY_SOURCE'
          import { pathToFileURL } from 'node:url';
          const wrapper = await import(pathToFileURL(process.env.RUNNER_TEMP + '/claude-compat/compat.mjs').href);
          wrapper.assertPacket();
          await wrapper.verifySource(process.env.GITHUB_WORKSPACE + '/frozen-source');
          console.log(JSON.stringify({ status: 'trusted-main-source-qualified', integrationFiles: 11, executableClosureFiles: 28 }));
          VERIFY_SOURCE
          mkdir -p "$RUNNER_TEMP/claude-cloud-tools"
          cp frozen-source/scripts/automation/claude-cloud-tools/package.json frozen-source/scripts/automation/claude-cloud-tools/package-lock.json "$RUNNER_TEMP/claude-cloud-tools/"
          npm ci --prefix "$RUNNER_TEMP/claude-cloud-tools" --no-audit --no-fund
      - name: Fresh real subscription probe and exact native bound bugfix PR review
        shell: bash
        env:
          CLAUDE_CLI_PATH: ${{ runner.temp }}/claude-cloud-tools/node_modules/.bin/claude
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/claude-compat/compat.mjs" "$GITHUB_WORKSPACE/frozen-source"
      - name: Upload full worker sanitized receipt including retained report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-review-compat-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-review-compat-receipt.json
          if-no-files-found: error
          retention-days: 14
