name: Adopt verified demo-scope fix and request first Claude review
on:
  push:
    branches: [codex/cloud-review-projection-20261021]
permissions:
  contents: read
concurrency:
  group: clinicos-root-first-review499
  cancel-in-progress: false
jobs:
  verified-first-review:
    if: github.repository == 'l2v-hub/ClinicOS' && github.event_name == 'push' && github.ref == 'refs/heads/codex/cloud-review-projection-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fbaa78d8c7eacf8402db0c8fa2be276ae579a27c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Adopt actual verified packet and request only the first review on exact tested SHA
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from'node:assert/strict';import os from'node:os';import path from'node:path';import{writeFileSync}from'node:fs';
          import{createRunner}from'./agent-team/src/bug-pipeline/process.mjs';import{createGitHub,controllerFailureCode}from'./agent-team/src/bug-pipeline/github.mjs';import{createStandaloneReview}from'./agent-team/src/bug-pipeline/standalone-review.mjs';
          const repo='l2v-hub/ClinicOS',pr=499,sha='561428ddab27578eb8b79b9eeb17c5e8fff44c6c',cwd=process.cwd(),run=createRunner({runtimeRoot:path.join(os.tmpdir(),'fixed-first-review499')}),github=createGitHub({repo,cwd,run}),standalone=createStandaloneReview({github,run,cwd}),manifest=JSON.parse(Buffer.from('','base64').toString('utf8'));
          const api=async(route)=>{assert(route==='user'||/^repos\/l2v-hub\/ClinicOS\/[A-Za-z0-9_?&=.%/-]+$/.test(route));const r=await run({command:'gh',args:['api',route],cwd,envMode:'controller',maxOutputBytes:2*1024*1024});assert(r.ok,'FIXED_METADATA_READ_FAILED');return JSON.parse(r.stdout);};
          const native=async()=>{const p=await api('repos/'+repo+'/pulls/499');assert.equal(p.state,'open');assert.equal(p.head.sha,sha);assert.equal(p.head.ref,'codex/protect-demo-secret');assert.equal(p.head.repo.full_name,repo);assert.equal(p.head.repo.fork,false);assert.equal(p.base.ref,'main');const c=await api('repos/'+repo+'/commits/'+sha+'/check-runs?per_page=100');assert.equal(c.total_count,c.check_runs.length);for(const name of['bug-pipeline-tests','secret-scan','frontend-tests','archive-tests','gate','browser-e2e']){const check=c.check_runs.filter(x=>x.name===name&&x.head_sha===sha&&x.app?.id===15368).sort((a,b)=>b.id-a.id)[0];assert.equal(check?.status,'completed',name);assert.equal(check.conclusion,'success',name);}return p;};
          let stage='preflight';const resultFile=process.env.RUNNER_TEMP+'/first-review499-result.json';const save=(extra={})=>writeFileSync(resultFile,JSON.stringify({schemaVersion:1,pr,sha,stage,at:new Date().toISOString(),noProviderOrCredentialOperation:true,...extra},null,2));
          try{assert.equal((await api('user')).login,'l2v-hub');assert.equal(manifest.pr.number,pr);assert.equal(manifest.sha,sha);assert.equal(manifest.implementation.length,2);assert.equal(manifest.implementation[0].status,'failed');assert.equal(manifest.implementation[0].subjectSha,null);assert.equal(manifest.implementation[1].subjectSha,'24dca690a3982f4d8d3caccd969849bb72d278ec');assert.equal(manifest.reviews.length,0);let p=await native();save();
          if(p.draft){await native();const ready=await run({command:'gh',args:['pr','ready','499','--repo',repo],cwd,envMode:'controller'});assert(ready.ok,'FIXED_DRAFT_READY_FAILED');}assert.equal((await native()).draft,false);stage='native-six-pass-ready';save();
          let state=await github.createStateStore().load(),existing=state.standaloneReviews?.find(x=>x.pr.number===pr),subject;if(existing){assert.equal(existing.sha,sha);assert.deepEqual(existing.packet,manifest.packet);assert.deepEqual(existing.sourceManifest,manifest.sourceManifest);assert.deepEqual(existing.implementation,manifest.implementation);subject=existing;}else{subject=await standalone.adopt(manifest);}stage='actual-adoption-persisted';save({implementationAttemptsPreserved:subject.implementation.length});
          await native();if(!subject.externalReview){assert.equal(subject.reviews.length,0);subject=await standalone.request(pr);}else{assert.equal(subject.externalReview.subjectSha,sha);assert(['comment-requested','comment-running','published','finished'].includes(subject.externalReview.status));}stage='actual-review-request-persisted';save({requestId:subject.externalReview.requestId,status:subject.externalReview.status});
          await standalone.publishState(subject);stage='actual-ready-label-projected';state=await github.createStateStore().load();subject=state.standaloneReviews.find(x=>x.pr.number===pr);assert.equal(subject.sha,sha);save({requestId:subject.externalReview.requestId,status:subject.externalReview.status,reviews:subject.reviews.length});console.log(JSON.stringify({pr,sha,stage,requestId:subject.externalReview.requestId,status:subject.externalReview.status}));
          }catch(error){save({failureCode:controllerFailureCode(error),remoteOutcome:'Read canonical state and actual comments before retry; no automatic new request.'});throw error;}
          JS
      - name: Preserve safe durable-stage receipt including partial outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-review499-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/first-review499-result.json
          if-no-files-found: warn
          retention-days: 14
