name: Handoff verified eight-issue packet to Claude
on:
  push:
    branches: [codex/cloud-review-projection-20261021]
permissions:
  contents: read
concurrency:
  group: clinicos-root-verified-handoff-497
  cancel-in-progress: false
jobs:
  verified-handoff:
    if: github.repository == 'l2v-hub/ClinicOS' && github.event_name == 'push' && github.ref == 'refs/heads/codex/cloud-review-projection-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fbaa78d8c7eacf8402db0c8fa2be276ae579a27c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Request first actual Claude review only on verified live commit
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import os from 'node:os';
          import path from 'node:path';
          import { createRunner } from './agent-team/src/bug-pipeline/process.mjs';
          import { createGitHub } from './agent-team/src/bug-pipeline/github.mjs';
          import { createCommentReviewHandoff } from './agent-team/src/bug-pipeline/comment-review-handoff.mjs';
          import { createIssueReviewCommunication } from './agent-team/src/bug-pipeline/issue-review-communication.mjs';
          import { externalReport } from './agent-team/src/bug-pipeline/external-review.mjs';
          const repo='l2v-hub/ClinicOS',sha='17a127c432f39e094f2746dc33c38bcb234ce719',cwd=process.cwd();
          const run=createRunner({runtimeRoot:path.join(os.tmpdir(),'fixed-first-Claude497')}),github=createGitHub({repo,cwd,run});
          const api=async(route)=>{const r=await run({command:'gh',args:['api',route],cwd,envMode:'controller',maxOutputBytes:2*1024*1024});assert(r.ok);return JSON.parse(r.stdout);};
          const native=async()=>{const p=await api('repos/'+repo+'/pulls/497');assert.equal(p.head.sha,sha);assert.equal(p.head.repo.full_name,repo);assert.equal(p.base.ref,'main');assert.equal(p.state,'open');const c=await api('repos/'+repo+'/commits/'+sha+'/check-runs?per_page=100');for(const name of ['bug-pipeline-tests','secret-scan','frontend-tests','archive-tests','gate','browser-e2e']){const r=c.check_runs.filter(x=>x.name===name&&x.head_sha===sha&&x.app?.id===15368).sort((a,b)=>b.id-a.id)[0];assert.equal(r?.status,'completed',name);assert.equal(r.conclusion,'success',name);}return p;};
          const handoff=createCommentReviewHandoff({github,run,cwd});const loaded=await handoff.load(497);assert.equal(loaded.batch.sha,sha);assert.equal(loaded.batch.reviews.length,0);assert.equal(loaded.batch.implementation.at(-1).status,'passed');assert.equal(loaded.batch.independentQa.status,'verified');assert.equal(loaded.batch.evidence.length,8);assert.equal(loaded.batch.operatorPublication.publishedSha,sha);
          const p=await native();if(p.draft){await native();const ready=await run({command:'gh',args:['pr','ready','497','--repo',repo],cwd,envMode:'controller'});assert(ready.ok);}
          await native();const notice='<!-- codex-bug-pipeline:publication12:497:'+sha+' -->';const comments=await api('repos/'+repo+'/issues/497/comments?per_page=100');if(!comments.some(c=>c.user.login==='l2v-hub'&&c.body.startsWith(notice))){await native();await github.commentPR(497,notice+'\nPrima review Claude sul commit verificato '+sha+'. Sei check nativi PASS. Fonteclinica invariata: integrazione indipendente51testPASS su f394e3a7, import desktop/tablet precedente conservato. [Pacchetto12 e prove autentiche degli8bug](https://github.com/'+repo+'/tree/'+sha+'/artifacts/task-validation/bug-batch-447/review-packet-12), [manifest screenshot/video/Playwright](https://github.com/'+repo+'/blob/'+sha+'/artifacts/task-validation/bug-batch-447/evidence-manifest.json). Provenienza486 corretta: cattura continuazione2, rapporto successivo5 distinto. Parent483: Claude5 e Codexfinale63PASS. Rilascio distinto: supporto32MiB verificatoindipendentemente maancoranonmergiato. Nessun nuovo testUI/deploy/chiusura dichiarato.');}
          await native();const batch=await handoff.request(497);assert.equal(batch.sha,sha);assert.equal(batch.externalReview.status,'comment-requested');await createIssueReviewCommunication({github,repo,cwd,run,readReport:externalReport}).publishState(batch);console.log(JSON.stringify({pr:497,sha,firstActualClaudeRequest:true,requestId:batch.externalReview.requestId,phase:batch.phase}));
          JS
      - name: Bind actual completed independent Codex result without another review
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import os from 'node:os';
          import path from 'node:path';
          import { createRunner } from './agent-team/src/bug-pipeline/process.mjs';
          import { createGitHub } from './agent-team/src/bug-pipeline/github.mjs';
          import { feedbackFingerprint, sha256 } from './agent-team/src/bug-pipeline/contracts.mjs';
          const repo='l2v-hub/ClinicOS',sha='4983de2bdb6ea571053f03a508c919d27ff1771b';
          const run=createRunner({runtimeRoot:path.join(os.tmpdir(),'fixed-codex-final483-binding')}),gh=createGitHub({repo,cwd:process.cwd(),run}),store=gh.createStateStore();
          const api=async(route,method='GET',body)=>{assert(new RegExp('^repos/l2v-hub/ClinicOS/[A-Za-z0-9_?&=.%/-]+$').test(route));const r=await run({command:'gh',args:['api','--method',method,route,...(body===undefined?[]:['--input','-'])],...(body===undefined?{}:{input:JSON.stringify(body)}),cwd:process.cwd(),envMode:'controller',maxOutputBytes:2*1024*1024});assert(r.ok,'Fixed GitHub metadata operation failed');return r.stdout.trim()?JSON.parse(r.stdout):null;};
          const before=await store.load(),state=structuredClone(before),batch=state.batches.find(b=>b.id==='bug-batch-432');
          assert.equal(batch.sha,sha);assert.equal(batch.approvedSha,sha);assert.equal(batch.reviews.at(-1).status,'approved');assert.equal(batch.reviews.at(-1).subjectSha,sha);assert.equal(batch.externalReview.status,'published');assert.equal(batch.externalReview.reportComment,6324884337);assert.equal(batch.externalReview.feedbackChanged,false);
          const final=batch.operatorFinalReviews.at(-1);assert.equal(final.nonce,'aab85ba4-680a-4265-9d8c-64ad4e159932');assert.equal(final.status,'verified');assert.equal(final.subjectSha,sha);assert.equal(final.freshTargetedPass,63);assert.equal(final.sealSha256,'38c6e8703b50cbab21d1dcd61b5f5609820cde0ac98a375fe5b8032e3b3b6be7');
          const report=await api('repos/'+repo+'/issues/comments/6324884337');assert.equal(report.user.login,'l2v-hub');assert.equal(sha256(report.body),batch.externalReview.reportBodySha256);
          const comments=await api('repos/'+repo+'/issues/483/comments?per_page=100');const marker='<!-- clinicos-final-codex:483:4983de2b:Claude5 -->',protocol='<!-- codex-bug-pipeline:final-codex:483:4983de2b -->';const own=comments.filter(c=>c.user.login==='l2v-hub'&&(c.body.startsWith(marker)||c.body.startsWith(protocol)));assert.equal(own.length,1);assert(Number.isSafeInteger(own[0].id));assert(own[0].body.includes(sha));
          const head=await gh.reviewFeedback(483);assert.equal(head.head,sha);assert.equal(head.unresolved,false);assert.equal(head.changesRequested,false);
          // Preserve the actual final comment's text, marking this owned status notice as protocol.
          if(!own[0].body.startsWith(protocol))await api('repos/'+repo+'/issues/comments/'+own[0].id,'PATCH',{body:protocol+'\n'+own[0].body});
          const current=await gh.reviewFeedback(483),fingerprint=feedbackFingerprint(current);assert.equal(current.head,sha);assert.equal(current.unresolved,false);assert.equal(current.changesRequested,false);assert.equal(fingerprint,batch.externalReview.feedbackFingerprint,'Additional PR feedback changed; no silent reapproval');assert((await gh.requiredChecks(483)).ok);
          if(batch.codexFinalReview&&batch.codexFinalReview.subjectSha!==sha){batch.operatorPriorCodexFinalReviews??=[];batch.operatorPriorCodexFinalReviews.push(structuredClone(batch.codexFinalReview));}
          batch.codexFinalReview={subjectSha:sha,claudeRound:5,status:'verified',summary:'Actual independent final Codex:63 targeted and backendtypesPASS, four previousP1 repro cases denied without new rows; report '+final.reportSha256,operatorReservationNonce:final.nonce,actualEvidenceSealSha256:final.sealSha256};batch.feedbackFingerprint=fingerprint;
          batch.operatorFinalReleaseBinding={at:new Date().toISOString(),subjectSha:sha,actualClaudeReportComment:6324884337,actualCodexReservation:final.nonce,fingerprint,releaseHoldPreserved:Boolean(batch.releaseHold),noNewReviewOrImplementation:true};state.updatedAt=new Date().toISOString();
          await store.save(state,{guard:async()=>{assert.deepEqual(await store.load(),before);const latest=await gh.reviewFeedback(483);assert.equal(latest.head,sha);assert.equal(feedbackFingerprint(latest),fingerprint);return true;}});assert.deepEqual(await store.load(),state);console.log(JSON.stringify({pr:483,sha,actualCodexFinalBound:true,feedbackUnchanged:true,releaseHoldPreserved:Boolean(batch.releaseHold)}));
          JS
