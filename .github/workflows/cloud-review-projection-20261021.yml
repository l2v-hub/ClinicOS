name: Publish verified metadata and completed Codex review v2
on:
  push:
    branches: [codex/cloud-review-projection-20261021]
permissions:
  contents: read
concurrency:
  group: clinicos-root-fixed-metadata-publication
  cancel-in-progress: false
jobs:
  publish-fixed-metadata:
    if: github.repository == 'l2v-hub/ClinicOS' && github.event_name == 'push' && github.ref == 'refs/heads/codex/cloud-review-projection-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read only the fixed metadata artifact and publish authorized GitHub status
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh run download 39667459014 --repo l2v-hub/ClinicOS --name demo-secret-exposure-39667459014-1 --dir "$RUNNER_TEMP/fixed-metadata-probe" > "$RUNNER_TEMP/fixed-artifact-read.stdout" 2> "$RUNNER_TEMP/fixed-artifact-read.stderr"; then
            echo FIXED_METADATA_ARTIFACT_READ_FAILED >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, lstatSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const base='https://api.github.com/repos/l2v-hub/ClinicOS';
          async function api(route,method='GET',body){assert(/^\/[A-Za-z0-9_?&=.%/-]+$/.test(route));const r=await fetch(base+route,{method,headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},...(body===undefined?{}:{body:JSON.stringify(body)})});assert(r.ok,'FIXED_GITHUB_OPERATION_FAILED_'+r.status);return r.status===204?null:r.json();}
          async function assert483(){const p=await api('/pulls/483');assert.equal(p.head.sha,'4983de2bdb6ea571053f03a508c919d27ff1771b');assert.equal(p.state,'open');}
          const file=process.env.RUNNER_TEMP+'/fixed-metadata-probe/demo-secret-exposure.json',info=lstatSync(file);assert(info.isFile()&&!info.isSymbolicLink()&&info.size<8192);const raw=readFileSync(file,'utf8');
          // Preserve exact original; the first probe formatter appended a literal slash-n.
          let normalizedLiteralNewline=false,text=raw;try{JSON.parse(text);}catch{assert(text.endsWith(String.fromCharCode(92)+'n'));text=text.slice(0,-2);normalizedLiteralNewline=true;}
          const p=JSON.parse(text);assert.equal(p.schemaVersion,1);assert.equal(p.repository,'l2v-hub/ClinicOS');assert.equal(p.ref,'refs/heads/codex/cloud-review-projection-20261021');assert.equal(p.workflowSha,'02eb222106ed11e832590916ddf8d55d5cc549f4');assert.equal(p.event,'push');assert.equal(p.runId,'39667459014');assert.equal(p.runAttempt,'1');assert.equal(p.workflowRef,'l2v-hub/ClinicOS/.github/workflows/cloud-review-projection-20261021.yml@refs/heads/codex/cloud-review-projection-20261021');assert.equal(p.protectedEnvironmentAttached,false);assert.equal(typeof p.ambientDemoTokenAvailable,'boolean');assert.equal(p.credentialValuesReadOrPrinted,false);assert.equal(p.ownerType,'User');assert.equal(p.organizationSecretInheritanceApplicable,false);assert(Number.isFinite(Date.parse(p.observedAt)));
          const run=await api('/actions/runs/39667459014');assert.equal(run.head_sha,p.workflowSha);assert.equal(run.event,'push');assert.equal(run.run_attempt,1);assert.equal(run.path,'.github/workflows/cloud-review-projection-20261021.yml');assert.equal(run.status,'completed');const expectedKeys=['schemaVersion','observedAt','repository','ref','workflowRef','workflowSha','event','runId','runAttempt','protectedEnvironmentAttached','ambientDemoTokenAvailable','credentialValuesReadOrPrinted','ownerType','organizationSecretInheritanceApplicable'];assert.deepEqual(Object.keys(p).sort(),expectedKeys.slice().sort());const metadata={...Object.fromEntries(expectedKeys.map(k=>[k,p[k]])),artifactSha256:createHash('sha256').update(raw).digest('hex'),originalBytes:info.size,normalizedLiteralNewline,runConclusion:run.conclusion,scope:'Ambient availability only; not a secret-name inventory or protected-environment presence proof.'};
          const marker='<!-- clinicos-actual-demo-secret-probe:39667459014 -->';const body=marker+'\nActual metadata-only check after Claude finding on PR498. No credential value was loaded or printed.\n\nRun: https://github.com/l2v-hub/ClinicOS/actions/runs/39667459014\n\n~~~json\n'+JSON.stringify(metadata,null,2)+'\n~~~\n\n'+(p.ambientDemoTokenAvailable?'The demo token is actually available outside the protected environment. Main-only environment policy alone does not restrict this accessible repository secret. The owner is a personal User, so organization secret inheritance does not apply. Moving/removing the repository-level copy requires Secrets write permission; the prior bot inventory returned unknown, never absent. No token has been copied, exposed or deleted.':'The demo token was unavailable to a same-repository non-environment branch job at the observed time. This proves no accessible ambient repository/org copy for that execution. Protected-environment presence and successful Railway identity remain separate and unproven.');
          const comments=await api('/issues/498/comments?per_page=100');let comment=comments.find(c=>c.user?.login==='l2v-hub'&&c.body?.startsWith(marker));if(!comment)comment=await api('/issues/498/comments','POST',{body});
          const pr=await api('/pulls/483');assert.equal(pr.head.sha,'4983de2bdb6ea571053f03a508c919d27ff1771b');assert.equal(pr.state,'open');const finalMarker='<!-- clinicos-final-codex:483:4983de2b:Claude5 -->';const finalBody=finalMarker+'\nCodex final review after actual Claude5 approval is complete: 63 fresh targeted tests and backend types PASS, zero findings. Previous P1 diagnostic now rejects four cases without new rows. Exact reviewed SHA4983de2bdb6ea571053f03a508c919d27ff1771b; all six native checks PASS. Final report SHA256226a4a0d9070d3009bd68b10bd2d9cfabc54a4ee24cdfc9735266f9233a2f971; seal38c6e8703b50cbab21d1dcd61b5f5609820cde0ac98a375fe5b8032e3b3b6be7. Historical failures retained. Code reviews complete; exact protected deployment preflight/release and online verification remain pending. No repeat Claude review for unchanged approved code. No deployment or issue closure claimed.';const finals=await api('/issues/483/comments?per_page=100');if(!finals.some(c=>c.user?.login==='l2v-hub'&&c.body?.startsWith(finalMarker))){await assert483();await api('/issues/483/comments','POST',{body:finalBody});}
          await assert483();await api('/issues/483/labels','POST',{labels:['codex-release-pending']});const labels=await api('/issues/483/labels');for(const label of labels.filter(x=>['claude-review-ready','claude-reviewing','codex-review-ready','codex-review-fixes'].includes(x.name))){await assert483();await api('/issues/483/labels/'+encodeURIComponent(label.name),'DELETE');}
          const dashboard=Buffer.from('','base64').toString('utf8')+'\n\n**Actual probe:** '+(p.ambientDemoTokenAvailable?'RAILWAY_DEMO_TOKEN disponibile anche fuori dall’ambiente protetto: copia a livello repository da rimuovere/spostare con permesso Secrets write.':'RAILWAY_DEMO_TOKEN assente nel job senza ambiente; presenza nell’ambiente protetto ancora distinta da verificare.')+' [Risultato effettivo]('+comment.html_url+').';const saved=await api('/issues/comments/6255929384');assert.equal(saved.user.login,'l2v-hub');assert(saved.body.startsWith('<!-- clinicos-all23-live-progress:20261021 -->'));await api('/issues/comments/6255929384','PATCH',{body:dashboard});writeFileSync(process.env.RUNNER_TEMP+'/metadata-relay-result.json',JSON.stringify({metadata,commentId:comment.id,commentUrl:comment.html_url,pr483FinalPublished:true,dashboardUpdated:true},null,2));console.log(JSON.stringify({ambientDemoTokenAvailable:p.ambientDemoTokenAvailable,probeCommentId:comment.id,pr483FinalPublished:true,dashboardUpdated:true}));
          JS
      - name: Preserve only safe metadata publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-relay-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metadata-relay-result.json
          if-no-files-found: warn
          retention-days: 14
