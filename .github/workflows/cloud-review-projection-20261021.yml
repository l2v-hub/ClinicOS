name: Publish verified two-PR review handoffs
on:
  push:
    branches: [codex/cloud-review-projection-20261021]
permissions:
  contents: read
concurrency:
  group: clinicos-verified-two-review-handoffs-relay11
  cancel-in-progress: false
jobs:
  verified-review-handoffs:
    if: github.repository == 'l2v-hub/ClinicOS' && github.event_name == 'push' && github.ref == 'refs/heads/codex/cloud-review-projection-20261021' && github.actor == 'l2v-hub' && github.triggering_actor == 'l2v-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Reject any non-owner operational push
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'l2v-hub/ClinicOS'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/codex/cloud-review-projection-20261021'
          test "$GITHUB_ACTOR" = 'l2v-hub'
          test "$GITHUB_TRIGGERING_ACTOR" = 'l2v-hub'
          test "$GITHUB_WORKFLOW_REF" = 'l2v-hub/ClinicOS/.github/workflows/cloud-review-projection-20261021.yml@refs/heads/codex/cloud-review-projection-20261021'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fbaa78d8c7eacf8402db0c8fa2be276ae579a27c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run frozen bounded metadata relay from trusted main
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relay11"
          printf '%s\n' '{"schemaVersion":1,"status":"started"}' > "$RUNNER_TEMP/two-review-handoffs-stage.json"
