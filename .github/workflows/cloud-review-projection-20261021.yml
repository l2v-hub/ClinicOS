name: Request second Claude review of verified demo-scope fix
on:
  push:
    branches: [codex/cloud-review-projection-20261021]
permissions:
  contents: read
concurrency:
  group: clinicos-root-review499-relay10
  cancel-in-progress: false
jobs:
  verified-second-review:
    if: github.repository == 'l2v-hub/ClinicOS' && github.event_name == 'push' && github.ref == 'refs/heads/codex/cloud-review-projection-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fbaa78d8c7eacf8402db0c8fa2be276ae579a27c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Adopt verified revision preserving history and request its second review
        env:
          GH_TOKEN: ${{ secrets.CLINICOS_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from'node:assert/strict';import os from'node:os';import path from'node:path';import{writeFileSync}from'node:fs';import{createHash}from'node:crypto';
          import{createRunner}from'./agent-team/src/bug-pipeline/process.mjs';import{createGitHub,controllerFailureCode}from'./agent-team/src/bug-pipeline/github.mjs';import{createStandaloneReview}from'./agent-team/src/bug-pipeline/standalone-review.mjs';
          const repo='l2v-hub/ClinicOS',pr=499,sha='34996816c9b8149a4a90f9ccfc7eabec230d2828',oldSha='561428ddab27578eb8b79b9eeb17c5e8fff44c6c',sourceSha='fcf91e9ed6bab01c7c02a9665f051bb2b7b1209b',cwd=process.cwd(),run=createRunner({runtimeRoot:path.join(os.tmpdir(),'fixed499-review2-relay10')}),github=createGitHub({repo,cwd,run}),standalone=createStandaloneReview({github,run,cwd}),manifest=JSON.parse(Buffer.from('','base64').toString('utf8')),hash=b=>createHash('sha256').update(b).digest('hex');
          const api=async route=>{assert(route==='user'||/^repos\/l2v-hub\/ClinicOS\/(pulls\/499|commits\/[a-f0-9]{40}\/check-runs\?per_page=100)$/.test(route));const r=await run({command:'gh',args:['api',route],cwd,envMode:'controller',maxOutputBytes:4*1024*1024});assert(r.ok,'FIXED_METADATA_READ_FAILED');return JSON.parse(r.stdout);};
          const native=async()=>{const p=await api('repos/'+repo+'/pulls/499');assert.equal(p.state,'open');assert.equal(p.draft,false);assert.equal(p.head.sha,sha);assert.equal(p.head.ref,'codex/protect-demo-secret');assert.equal(p.head.repo.full_name,repo);assert.equal(p.head.repo.fork,false);assert.equal(p.base.ref,'main');assert.equal(p.base.repo.full_name,repo);const c=await api('repos/'+repo+'/commits/'+sha+'/check-runs?per_page=100');assert.equal(c.total_count,c.check_runs.length);for(const name of['bug-pipeline-tests','secret-scan','frontend-tests','archive-tests','gate','browser-e2e']){const j=c.check_runs.filter(x=>x.name===name&&x.head_sha===sha&&x.app?.id===15368).sort((a,b)=>b.id-a.id)[0];assert.equal(j?.status,'completed',name);assert.equal(j.conclusion,'success',name);}return p;};
          let stage='preflight';const save=(extra={})=>writeFileSync(process.env.RUNNER_TEMP+'/second-review499-result.json',JSON.stringify({schemaVersion:1,pr,sha,sourceSha,stage,at:new Date().toISOString(),noProviderOrCredentialValueOperation:true,...extra},null,2));
          try{assert.equal((await api('user')).login,'l2v-hub');await native();let state=await github.createStateStore().load(),subject=state.standaloneReviews.find(x=>x.pr.number===pr);const archive=state.operatorAdoptionArchives.find(x=>x.id==='499-before-verified-revision2'&&x.pendingPublicationSha===sha);assert(archive);assert.equal(hash(JSON.stringify(archive.subject)),archive.subjectSha256);assert.equal(archive.subject.externalReview.subjectSha,oldSha);assert.equal(archive.subject.externalReview.reportComment,6327476006);assert.equal(archive.subject.externalReview.reportBodySha256,'1ba0f7b1e2ba4a1ebdec9835d831a60554d27a8096847f1ff8ee9f430b121a8f');assert.equal(archive.subject.operatorContinuations.at(-1).nonce,'4bb52efa-1d5c-4bb8-9e33-f57e6214aa88');assert.equal(archive.subject.operatorContinuations.at(-1).subjectSha,sourceSha);assert.equal(archive.subject.operatorContinuations.at(-1).status,'passed');assert.deepEqual(manifest.implementation,archive.subject.implementation);assert.deepEqual(manifest.reviews,archive.subject.reviews);assert.deepEqual(manifest.reviewLedger,archive.subject.reviewLedger);assert.deepEqual(manifest.reviewReports,archive.subject.reviewReports);assert.equal(manifest.sha,sha);assert.equal(manifest.packet.path,'artifacts/task-validation/protect-demo-secret-20261021/review-packet-2');assert.equal(Object.keys(manifest.packet.files).length,41);save();
          if(subject.sha===oldSha){assert.equal(subject.externalReview.status,'published');assert.equal(subject.reviews.length,1);assert.deepEqual(subject.operatorContinuations,archive.subject.operatorContinuations);await native();subject=await standalone.adopt(manifest);}else{assert.equal(subject.sha,sha);assert.deepEqual(subject.packet,manifest.packet);assert.deepEqual(subject.sourceManifest,manifest.sourceManifest);assert.deepEqual(subject.operatorContinuations,archive.subject.operatorContinuations);}stage='verified-revision-adopted';save({legacyAttempts:subject.implementation.length,continuations:subject.operatorContinuations.length,reviews:subject.reviews.length});
          await native();if(!subject.externalReview){assert.equal(subject.reviews.length,1);subject=await standalone.request(pr);}else{assert.equal(subject.externalReview.subjectSha,sha);assert(['comment-requested','comment-running','published','finished'].includes(subject.externalReview.status));}stage='second-review-request-persisted';save({requestId:subject.externalReview.requestId,status:subject.externalReview.status});await native();await standalone.publishState(subject);stage='actual-review-label-and-comment-projected';state=await github.createStateStore().load();subject=state.standaloneReviews.find(x=>x.pr.number===pr);assert.equal(subject.sha,sha);assert.equal(subject.operatorContinuations.at(-1).subjectSha,sourceSha);assert.equal(subject.operatorContinuations.at(-1).nonce,'4bb52efa-1d5c-4bb8-9e33-f57e6214aa88');save({requestId:subject.externalReview.requestId,status:subject.externalReview.status,reviews:subject.reviews.length});console.log(JSON.stringify({stage,pr,sha,requestId:subject.externalReview.requestId,status:subject.externalReview.status}));
          }catch(error){save({failureCode:controllerFailureCode(error),remoteOutcome:'Read actual canonical stage/comments before retry; no automatic new request/reset.'});throw error;}
          JS
      - name: Preserve safe durable-stage receipt even on partial outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-review499-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/second-review499-result.json
          if-no-files-found: warn
          retention-days: 14
